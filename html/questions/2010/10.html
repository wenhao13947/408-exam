<body>
<div class="content"><p>采用递归方式对顺序表进行快速排序。下列关于递归次数的叙述中，正确的是（）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">递归次数与初始数据的排列次序无关。</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">每次划分后，先处理较长的分区可以减少递归次数。</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">每次划分后，先处理较短的分区可以减少递归次数。</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">递归次数与每次划分后得到的分区的处理顺序无关。</span></div></div>
