<div class="content"><div class="analysis-content"><br/>无向图边数的两倍等于各顶点度数的总和。由于其他顶点的度均小于 3，可以设它们的度都为 2，设它们的数量是 X，可列出方程 3×4 + 4×3 + 2x = 16×2，解得 x = 4。4 + 3 + 4 = 11，B 正确。</div></div>
