<div class="content"><p>下列关于非空 B 树的叙述中，正确的是（ ）</p>
<p>I. 插入操作可能增加树的高度</p>
<p>II. 删除操作一定会导致叶结点的变化</p>
<p>III. 查找某关键字一定是要查找到叶结点</p>
<p>IV. 插入的新关键字最终位于叶结点中</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅 I</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 I、II</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 III、IV</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅 I、II、IV</span></div></div>
