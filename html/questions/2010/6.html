<body>
<div class="content"><p>对 n (n≥2) 个权值均不相同的字符构成哈夫曼树。下列关于该哈夫曼树的叙述中，错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">该树一定是一棵完全二叉树</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">树中一定没有度为 1 的结点</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">树中两个权值最小的结点一定是兄弟结点</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">树中任一非叶结点的权值一定不小于下一层任一结点的权值</span></div></div>


</body>
