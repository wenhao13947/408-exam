<div class="content"><div class="analysis-content"><br/><p>多个进程可同时以“读”或“写”方式打开文件，操作系统并不保证写操作的互斥性，进程可通过系统调用对文件加锁，保证互斥写（读者 - 写者问题），选项 A 错误。</p><p>整个系统只有一个 系统文件打开表，同一个文件打开多次只需改变引用计数，选项 B 正确。</p><p>用户进程的打开文件表关于同一个文件不一定相同，例如读写指针位置不一定相同，选项 C 错误。</p><p>进程关闭文件时，文件的引用计数减 1 , 引用计数变为 0 时才删除系统打开文件表中的表项，选项 D 错误。</p></div></div>
