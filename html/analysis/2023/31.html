<div class="content"><div class="analysis-content"><br/>索引节点是指文件系统中的一种数据结构，每个索引节点保存了文件系统中的一个文
件系统对象的元信息数据，但不包括数据内容或者文件名。内存索引节点是存放在内存中的索
引节点，文件被打开时，需要将磁盘索引节点复制到内存索引节点中。因此本题进程 P 关闭 F
时，需释放 F 的索引节点所占的内存空间。所以该题的正确答案为 B 选项。</div></div>
