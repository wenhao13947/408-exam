<div class="content"><div class="analysis-content"><br/>在 P2P 模型 中，每个结点的权利和义务是对等的，在 C/S 模型中，客户是服务发起请求，使服务器被动接受各地客户的请求，但是客户之间不能直接通信，例如 Web 应用中两个浏览器不能直接通信，P2P 模型减轻了对某个服务器的计算压力，可以将任务分配到各个节点，提高了系统效率和资源利用率。</div></div>
