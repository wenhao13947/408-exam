<body>
<div class="content"><p>下列关于 SMTP 协议的叙述中，正确的是（ ）。</p>
<p>I. 只支持传输 7 比特 ASCII 码内容</p>
<p>II. 支持在邮件服务器之间发送邮件</p>
<p>III. 支持从用户代理向邮件服务器发送邮件</p>
<p>IV. 支持从邮件服务器向用户代理发送邮件</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅 I、II 和 III</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 I、II 和 IV</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 I、III 和 IV</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅 II、III 和 IV</span></div></div>


</body>
