<div class="content"><p>外部中断包括不可屏蔽中断（NMI）和可屏蔽中断，下列关于外部中断的叙述中错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">CPU 处于关中断状态时也能响应 NMI 请求；</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">一旦可屏蔽中断请求信号有效，CPU 将立即响应；</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">不可屏蔽中断的优先级比可屏蔽中断的优先级高；</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">可通过中断屏蔽字改变可屏蔽中断的处理优先级。</span></div></div>
