<div class="content"><p>下列关于 IP 路由器功能的描述中，正确的是（ ）。</p>
<p>I. 运行路由协议，设置路由表</p>
<p>II. 监测到拥塞时，合理丢弃 IP 分组</p>
<p>III. 对收到的 IP 分组头进行差错校验，确保传输的 IP 分组不丢失</p>
<p>IV. 根据收到的 IP 分组的目的 IP 地址，将其转发到合适的输出线路上</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅 III、IV</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 I、II、III</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 I、II、IV</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">I、II、III、IV</span></div></div>


</body>
