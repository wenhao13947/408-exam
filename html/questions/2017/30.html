<div class="content"><p>某文件系统中，针对每个文件，用户类别分为 4 类：安全管理员、文件主、文件主的伙伴、其他用户；访问权限分为 5 种：完全控制、执行、修改、读取、写入。若文件控制块中用二进制位串表示文件权限，为表示不同类别用户对一个文件的访问权限，则描述文件权限的位数至少应为（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">5</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">9</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">12</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">20</span></div></div>
