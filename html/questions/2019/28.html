<title>2019-第28题-题目</title>

<body>
<div class="content"><p>在分段存储管理系统中，用共享段表描述所有共享的段。若进程 P1 和 P2 共享段 S，下列叙述中，错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">在物理内存中仅保存一份段 S 的内容</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">段 S 在 P1 和 P2 中应该具有相同的段号</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">P1 和 P2 共享段 S 在共享段表中的段表项</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">P1 和 P2 都不再使用段 S 时才回收段 S 所占的内存空间</span></div></div>


</body>
</html>
