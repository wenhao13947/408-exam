<div class="content"><div class="analysis-content"><br/>变址寻址 中，有效地址 EA 等于指令字中的形式地址 D 与变址寄存器 I 的内容相加之和，即 EA= (I)+ D。间接寻址是相对于直接寻址而言的，指令的地址字段给出的形式地址不是操作数的真正地址，而是操作数地址的地址，即 EA=(D)。从而该 操作数的有效地址是 ((I)+ D)。</div></div>
