<title>2017-第31题-题目</title>

<body>
<div class="content"><p>若文件 f1 的硬链接为 f2，两个进程分别打开 f1 和 f2，获得对应的文件描述符为 fd1 和 fd2，则下列叙述中，正确的是（ ）。</p>
<p>Ⅰ. f1 和 f2 的读写指针位置保持相同</p>
<p>Ⅱ. f1 和 f2 共享同一个内存索引结点</p>
<p>Ⅲ. fd1 和 fd2 分别指向各自的用户打开文件表中的一项</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅Ⅲ</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅Ⅱ、Ⅲ</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅Ⅰ、Ⅱ</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">Ⅰ、Ⅱ和Ⅲ</span></div></div>


</body>
</html>
