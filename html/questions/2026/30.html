<div class="content">
<p>假设两个进程共享一个页 S，其页表分别为 PT1 和 PT2，S 在两个进程虚拟地址空间中的起始地址分别为 VA1 和 VA2，则下列叙述中，正确的是</p><div class="option"><span class="opt-label">A.</span><span class="opt-content">VA1 和 VA2 相同</span></div><div class="option"><span class="opt-label">B.</span><span class="opt-content">VA1 和 VA2 映射到的物理地址相同</span></div><div class="option"><span class="opt-label">C.</span><span class="opt-content">S 在 PT1 和 PT2 中的页表项内容相同</span></div><div class="option"><span class="opt-label">D.</span><span class="opt-content">S 在 PT1 和 PT2 中的页表项虚拟地址相同</span></div>
</div>
