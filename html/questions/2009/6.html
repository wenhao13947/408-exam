<div class="content"><p>将森林转换为对应的二叉树，若在二叉树中，结点 u 是结点 v 的父结点的父结点，则在原来的森林中，u 和 v 可能具有的关系是（ ）。</p>
<p>I. 父子关系</p>
<p>II. 兄弟关系</p>
<p>III. u 的父结点与 v 的父结点是兄弟关系</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">只有 II</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">I 和 II</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">I 和 III</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">I、II 和 III</span></div></div>
