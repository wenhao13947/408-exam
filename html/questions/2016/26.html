<div class="content"><p>某系统采用改进型 CLOCK 置换算法，页表项中字段 A 为访问位，M 为修改位。A=0 表示页最近没有被访问，A=1 表示页最近被访问过。M=0 表示页没有被修改过，M=1 表示页被修改过。按 (A, M) 所有可能的取值，将页分为四类：(0, 0)、(1, 0)、(0, 1) 和 (1, 1)，则该算法淘汰页的次序为（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">(0, 0), (0, 1), (1,0), (1, 1)</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">(0, 0), (1, 0), (0, 1), (1, 1)</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">(0, 0), (0, 1), (1, 1), (1, 0)</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">(0, 0), (1, 1), (0, 1), (1, 0)</span></div></div>
