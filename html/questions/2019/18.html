<title>2019-第18题-题目</title>

<body>
<div class="content"><p>在采用“取指、译码/取数、执行、访存、写回”5 段流水线的处理器中，执行如下指令序列，其中 s0、s1、s2、s3 和 t2 表示寄存器编号。</p>
<pre tabindex="0"><code>I1: add s2,s1,s0    // R[s2]←R[s1]+R[s0]
I2: load s3,0(t2)   // R[s3]←M[R[t2]+0]
I3: add s2,s2,s3    // R[s2]←R[s2]+R[s3]
I4: store s2,0(t2)  // M[R[t2]+0]←R[s2]
</code></pre>
<p>下列指令对中，不存在数据冒险的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">I1 和 I3</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">I2 和 I3</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">I2 和 I4</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">I3 和 I4</span></div></div>


</body>
</html>
