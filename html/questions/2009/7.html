<div class="content"><p>下列关于无向连通图特性的叙述中，正确的是（）。</p>
<p>I. 所有顶点的度之和为偶数</p>
<p>II. 边数大于顶点个数减 1</p>
<p>III. 至少有一个顶点的度为 1</p>

<div class="option"><span class="opt-label">B.</span><span class="opt-content">只有 II</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">I 和 II</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">I 和 III</span></div></div>
