<div class="content"><p>某机器字长 16 位，主存按字节编址，转移指令采用相对寻址，由两个字节组成，第一字节为操作码字段，第二字节为相对位移量字段。假定取指令时，每取一个字节 PC 自动加 1。若某转移指令所在主存地址为 2000H，相对位移量字段的内容为 06H，则该转移指令成功转移后的目标地址是（）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">2006H</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">2007H</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">2008H</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">2009H</span></div></div>
