<title>2026-第7题-题目</title>

<link href="../../css/style.css" rel="stylesheet"/></head>
<body>
<div class="content">
<p>有向图 G=(V,E) 的顶点个数为 n（n≥2），指定一个顶点为初始点，指定若干个顶点（非初始点）为标记点，且每个顶点都在从初始点到标记点的有向路径上（一条有向路径上允许含有多个标记点）。每条有向边上均有一个字符，从初始点到任一标记点的有向路径上的所有字符组成一个字符串，所有这样的字符串构成字符串集 S。下列关于 S 的叙述中，错误的是</p><div class="option"><span class="opt-label">A.</span><span class="opt-content">若 G 无环，则 S 是有穷集</span></div><div class="option"><span class="opt-label">B.</span><span class="opt-content">若 G 无环，则 S 中存在长度等于 n 的字符串</span></div><div class="option"><span class="opt-label">C.</span><span class="opt-content">若 G 有环，则 S 中存在长度大于 n 的字符串</span></div><div class="option"><span class="opt-label">D.</span><span class="opt-content">若 G 有环，则 S 中存在长度小于 2n 的字符串</span></div>
</div>
</body>
</html>
