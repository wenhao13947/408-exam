<div class="content"><div class="analysis-content"><br/>I 和 V 显然是 IP 路由器的 功能。对于Ⅱ，当路由器监测到拥塞时，可合理丢弃 IP 分组，并向发出该 IP 分组的源主机发送一个源点抑制的 ICMP 报文。对于 III，路由器对收到的 IP 分组首部进行差错检验，丢弃有差错首部的报文，但不保证 IP 分组不丢失。对于 IV，这表述的也就是路由器的路由功能。</div></div>
