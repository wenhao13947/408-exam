<div class="content"><p>下列关于批处理系统的叙述中，正确的是（  ）</p>

<p>Ⅱ.批处理系统分为单道批处理系统和多道批处理系统</p>
<p>Ⅲ.中断技术使得多道批处理系统的 I/O 设备可与 CPU 并行工作</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅Ⅱ、Ⅲ</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅Ⅱ</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅Ⅰ、Ⅱ</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅Ⅰ、Ⅲ</span></div></div>
