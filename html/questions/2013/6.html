<body>
<div class="content"><p>在任意一棵非空二叉排序树 T1 中，删除某结点 v 之后形成二叉排序树 T2 ，再将 v 插入 T2 形成二叉排序树 T3 。下列关于 T1 与 T3 的叙述中，正确的是（ ）。</p>
<p>I. 若 v 是 T1 的叶结点，则 T1 与 T3 不同</p>
<p>II. 若 v 是 T1 的叶结点，则 T1 与 T3 相同</p>
<p>III. 若 v 不是 T1 的叶结点，则 T1 与 T3 不同</p>
<p>IV. 若 v 不是 T1 的叶结点，则 T1 与 T3 相同</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅 I、III</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 I、IV</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 II、III</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅 II、IV</span></div></div>


</body>
