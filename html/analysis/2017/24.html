<div class="content"><div class="analysis-content"><br/>执行 系统调用 的过程是这样的：正在运行的进程先传递系统调用参数，然后由 陷入指令 负责将用户态转化为内核态，并将返回地址压入堆栈以备后用，接下来 CPU 执行相应的内核态服务程序，最后返回用户态。所以 C 正确。</div></div>
