<div class="content"><div class="analysis-content"><br/>银行家算法 是避免死锁的方法，破坏死锁产生的必要条件是预防死锁的方法。利用银行家算法，系统处于安全状态时就可以避免死锁（即此时必然无死锁）；当系统进入不安全状态后便可能进入死锁状态（但也不是必然）。</div></div>
