<div class="content"><p>下列关于散列法处理冲突的叙述中，正确的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">只要散列表不满，线性探查再散列一定能找到一个空闲位置</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">只要散列表不满，二次探查再散列一定能找到一个空闲位置</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">线性探查再散列处理的冲突，一定是发生在同义词之间</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">二次探查再散列处理的冲突，一定是发生在非同义词之间</span></div></div>
