<div class="content"><div class="analysis-content"><p>1）页框号为 21。理由：因为起始 驻留集 为空，因此 0 页对应的页框为空闲链表中的第三个空闲页框 21，其对应的页框号为 21。</p><p>2）页框号为 32。理由：因 11&gt;10 故发生第三轮扫描，页号为 1 的页框在第二轮已处于空闲页框链表中，此刻该页又被重新访问，因此应被重新放回驻留集中，其页框号为 32。</p><p>3）页框号为 41。理由：因为第 2 页从来没有被访问过，它不在驻留集中，因此从空闲页框链表中取出链表头的页框 41，页框号为 41。</p><p>4）合适。理由：如果程序的时间局部性越好，那么从空闲页框链表中重新取回的机会越大，该策略的优势越明显。</p></div></div>
