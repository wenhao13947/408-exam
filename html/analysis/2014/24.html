<div class="content"><div class="analysis-content"><br/>本题考察 死锁产生的必要条件，三个并发进程分别需要 3、4、5 台设备，当系统只有 (3-1) + (4-1) + (5-1) =9 台设备时，第一个进程分配 2 台，第二个进程分配 3 台，第三个进程分配 4 台。这种情况下，三个进程均无法继续执行下去，发生死锁。当系统中再增加 1 台设备，也就是总共 10 台设备时，这最后 1 台设备分配给任意一个进程都可以顺利执行完成，因此保证系统不发生死锁的最小设备数为 10。</div></div>
