<div class="content"><div class="analysis-content"><br/>页置换算法会影响缺页率，例如，LRU 算法的缺页率通常要比 FIFO 算法的缺页
率低，排除 A。工作集的大小决定了分配给进程的物理块数，分配给进程的物理块数越多，
缺页率就越低，排除 B。进程的数量越多，对内存资源的竞争越激烈，每个进程被分配的物
理块数越少，缺页率也就越高，排除 C。页缓冲队列是将被淘汰的页面缓存下来，暂时不写
回磁盘，队列长度会影响页面置换的速度，但不会影响缺页率，答案选 D。</div></div>
