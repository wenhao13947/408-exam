<div class="content"><p>在内部排序过程中，对尚未确定最终位置的所有元素进行一遍处理称为一趟排序。下列排序方法中，每一趟排序结束都至少能够确定一个元素最终位置的方法是（ ）。</p>
<p>Ⅰ．简单选择排序</p>
<p>Ⅱ．希尔排序</p>
<p>Ⅲ．快速排序</p>
<p>Ⅳ．堆排序</p>
<p>Ⅴ．二路归并排序</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅Ⅰ、Ⅲ、Ⅳ</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅Ⅰ、Ⅲ、Ⅴ</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅Ⅱ、Ⅲ、Ⅳ</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅Ⅲ、Ⅳ、Ⅴ</span></div></div>
