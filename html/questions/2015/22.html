<div class="option"><span class="opt-label">A.</span><span class="opt-content">内部异常的产生与当前执行指令相关</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">内部异常的检测由 CPU 内部逻辑实现</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">内部异常的响应发生在指令执行过程中</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">内部异常处理后返回到发生异常的指令继续执行</span></div></div>
