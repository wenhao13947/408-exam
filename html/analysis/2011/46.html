<div class="content"><div class="analysis-content"><p>1）在磁盘中连续存放（采取连续结构），磁盘寻道时间更短，文件随机访问效率更高；在 FCB 中加入的字段为：&lt;起始块号，块数&gt; 或者 &lt;起始块号，结束块号&gt;。</p><p>2）将所有的 FCB 集中存放，文件数据集中存放。这样在随机查找文件名时，只需访问 FCB 对应的块，可减少磁头移动和磁盘 I/O 访问次数。</p></div></div>
