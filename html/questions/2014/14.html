<div class="content"><p>float 型数据常用 IEEE754 单精度浮点格式表示。假设两个 float 型变量 x 和 y 分别存放在 32 位寄存器 f1 和 f2 中，若 (f1)=CC90 0000H，(f2)=B0C0 0000H，则 x 和 y 之间的关系为（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">x&lt;y 且符号相同</span></div>

<div class="option"><span class="opt-label">C.</span><span class="opt-content">x&gt;y 且符号相同</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">x&gt;y 且符号不同</span></div></div>
