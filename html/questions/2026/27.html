<p>若进程 P 读、写数据的集合分别记为 R(P) 和 W(P)，进程 Q 读、写数据的集合分别记为 R(Q) 和 W(Q)，则进程 P 和 Q 并发执行时不会发生并发错误的充要条件是</p><p>I. W(P) ∩ W(Q) = ∅<br>II. R(P) ∩ W(Q) = ∅<br>III. W(P) ∩ R(Q) = ∅<br>IV. R(P) ∩ R(Q) = ∅</p><div class="option"><span class="opt-label">A.</span><span class="opt-content">I、IV 同时成立</span></div><div class="option"><span class="opt-label">B.</span><span class="opt-content">II、III 同时成立</span></div><div class="option"><span class="opt-label">C.</span><span class="opt-content">I、II、III 同时成立</span></div><div class="option"><span class="opt-label">D.</span><span class="opt-content">I、II、III、IV 同时成立</span></div>
</div>
