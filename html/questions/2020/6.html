<div class="option"><span class="opt-label">A.</span><span class="opt-content">拓扑有序序列</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">逆拓扑有序序列</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">广度优先搜索序列</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">深度优先搜索序列</span></div></div>
