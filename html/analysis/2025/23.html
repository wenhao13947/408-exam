<div class="content"><div class="analysis-content"><br/>在 上下文切换 时，操作系统需要保存和恢复与当前进程相关的状态信息。通用寄存器、页表基址寄存器和程序计数器通常会在上下文切换时更新，以切换到新进程的上下文。然而，内核 中断向量表 基址寄存器通常是系统级的，通常不会在每次上下文切换时更改，因此操作系统不需要在上下文切换时更新该寄存器。</div></div>
