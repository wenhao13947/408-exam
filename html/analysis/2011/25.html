<div class="content"><div class="analysis-content"><br/>进程是资源分配的基本单位，线程 是处理机调度的基本单位。因此，进程的代码段、进程打开的文件、进程的全局变量等都是进程的资源，唯有进程中某线程的栈指针是属于线程的，属于进程的资源可以共享，属于线程的栈是独享的，对其他线程透明。</div></div>
