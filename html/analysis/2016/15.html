<div class="content"><div class="analysis-content"><br/>分析语旬 <code>a[k] = a[k] + 32</code>: 首先读取 <code>a[k]</code> 需要访问一次 <code>a[k]</code>，之后将结果赋值给 <code>a[k]</code> 需要访问一次，共访问两次。第一次访问 <code>a[k]</code> 未命中，并将该字所在的主存块调入 Cache 对应的块中，对于该主存块中的 4 个整数的两次访问中只在访问第一次的第一 个元素时发生缺失，其他
的 7 次访问中全部命中，故该程序段执行过程中访问数组 a 的 Cache 缺失率约为 1/8（即 12.5%）。</div></div>
