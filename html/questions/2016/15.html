<div class="content"><p>有如下 C 语言程序段：</p>
<div class="highlight"><pre style="background-color:#f8f8f8;-moz-tab-size:4;-o-tab-size:4;tab-size:4" tabindex="0"><code class="language-c" data-lang="c"><span style="display:flex"><span><span style="color:#204a87;font-weight:700">for</span> <span style="color:#000;font-weight:700">(</span><span style="color:#000">k</span> <span style="color:#ce5c00;font-weight:700">=</span> <span style="color:#0000cf;font-weight:700">0</span><span style="color:#000;font-weight:700">;</span> <span style="color:#000">k</span> <span style="color:#ce5c00;font-weight:700">&lt;</span> <span style="color:#0000cf;font-weight:700">1000</span><span style="color:#000;font-weight:700">;</span> <span style="color:#000">k</span><span style="color:#ce5c00;font-weight:700">++</span><span style="color:#000;font-weight:700">)</span>
</span></span><span style="display:flex"><span>    <span style="color:#000">a</span><span style="color:#000;font-weight:700">[</span><span style="color:#000">k</span><span style="color:#000;font-weight:700">]</span> <span style="color:#ce5c00;font-weight:700">=</span> <span style="color:#000">a</span><span style="color:#000;font-weight:700">[</span><span style="color:#000">k</span><span style="color:#000;font-weight:700">]</span> <span style="color:#ce5c00;font-weight:700">+</span> <span style="color:#0000cf;font-weight:700">32</span><span style="color:#000;font-weight:700">;</span>
</span></span></code></pre></div>
<p>若数组 a 以及变量 k 均为 int 型，int 型数据占 4B，数据 Cache 采用直接映射方式，数据区大小是 1KB，块大小是 16B，该程序段执行前 Cache 为空，则该程序段执行过程中，访问数组 a 的 Cache 的缺失率是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">1.25%</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">2.5%</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">12.5%</span></div>
