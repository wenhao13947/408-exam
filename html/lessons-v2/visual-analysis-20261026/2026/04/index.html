<script>
  const svg = document.getElementById('scene');
  const playButton = document.getElementById('play');
  const progress = document.getElementById('progress');
  const speedSelect = document.getElementById('speed');
  const clock = document.getElementById('clock');
  const chapterNav = document.getElementById('chapters');
  const namespace = 'http://www.w3.org/2000/svg';
  let data, nodes = [], nodeStates = [], chapterButtons = [];
  let time = 0, speed = 1, playing = false, lastTimestamp = null, lastSnapshot = -1;
  let animationFrame = null;

  const lessonPages = [{"start": 0, "stop": 4.46, "title": "原题 · 题干与选项"}, {"start": 4.625, "stop": 28.043333333333333, "title": "先看转换规则：五个根会连成一条右兄弟链"}, {"start": 28.208333333333332, "stop": 57.251666666666665, "title": "已经知道至少 6 层，再找一个恰好 6 层的摆法"}];
  const modeSelect = document.getElementById('lesson-mode');
  const previousPage = document.getElementById('previous-page');
  const nextPage = document.getElementById('next-page');
  const pageCounter = document.getElementById('page-counter');
  const jumpSelect=document.getElementById('lesson-jump');
  lessonPages.forEach((p,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${p.title}`;jumpSelect.append(o);});
  jumpSelect.addEventListener('change',()=>goToLessonPage(Number(jumpSelect.value)));
  let pageIndex = 0;

  function updateLessonNavigation() {
    for (let i = 0; i < lessonPages.length; i++) {
      if (lessonPages[i].start <= time + 0.001) pageIndex = i;
    }
    pageCounter.textContent = `${pageIndex + 1} / ${lessonPages.length}`;
    pageCounter.title = lessonPages[pageIndex].title;
    jumpSelect.value=String(pageIndex);
    previousPage.disabled = pageIndex === 0;
    nextPage.disabled = pageIndex === lessonPages.length - 1;
    playButton.textContent = playing ? '暂停' : modeSelect.value === 'manual' ? '演示本页' : '播放';
  }

  function toggleLessonPlayback() {
    if (playing) { pause(); updateLessonNavigation(); return; }
    if (modeSelect.value === 'manual' && time >= lessonPages[pageIndex].stop - 0.05) {
      seek(lessonPages[pageIndex].start);
    }
    play();
    updateLessonNavigation();
  }

  function goToLessonPage(index) {
    if (index < 0 || index >= lessonPages.length) return;
    const wasPlaying = playing;
    pause();
    pageIndex = index;
    seek(modeSelect.value === 'manual' ? lessonPages[index].stop : lessonPages[index].start);
    if (modeSelect.value === 'auto' && wasPlaying) play();
    updateLessonNavigation();
  }

  modeSelect.addEventListener('change', () => {
    pause();
    seek(modeSelect.value === 'manual' ? lessonPages[pageIndex].stop : lessonPages[pageIndex].start);
    if (modeSelect.value === 'auto') play();
    updateLessonNavigation();
  });
  previousPage.addEventListener('click', () => goToLessonPage(pageIndex - 1));
  nextPage.addEventListener('click', () => goToLessonPage(pageIndex + 1));

  function formatTime(value) {
    const seconds = Math.floor(value);
    return `${String(Math.floor(seconds / 60)).padStart(2, '0')}:${String(seconds % 60).padStart(2, '0')}`;
  }

  function snapshotAt(value) {
    const tick = value * data.fps;
    let low = 0, high = data.frames.length - 1;
    while (low < high) {
      const middle = Math.ceil((low + high) / 2);
      if (data.frames[middle][0] <= tick) low = middle;
      else high = middle - 1;
    }
    return data.frames[low][1];
  }

  function draw() {
    const snapshotId = snapshotAt(time);
    if (snapshotId !== lastSnapshot) {
      const states = data.snapshots[snapshotId];
      for (let i = 0; i < states.length; i++) {
        if (!nodes[i]) {
          nodes[i] = document.createElementNS(namespace, 'path');
          svg.append(nodes[i]);
        }
        const node = nodes[i];
        node.removeAttribute('display');
        if (nodeStates[i] === states[i]) continue;
        const [path, x, y, fill, fillOpacity, stroke, strokeOpacity, strokeWidth] = data.states[states[i]];
        node.setAttribute('d', data.paths[path]);
        node.setAttribute('transform', `translate(${x} ${y})`);
        node.setAttribute('fill', fill);
        node.setAttribute('fill-opacity', fillOpacity);
        node.setAttribute('stroke', stroke);
        node.setAttribute('stroke-opacity', strokeOpacity);
        node.setAttribute('stroke-width', strokeWidth);
        nodeStates[i] = states[i];
      }
      for (let i = states.length; i < nodes.length; i++) nodes[i].setAttribute('display', 'none');
      lastSnapshot = snapshotId;
    }
    svg.append(document.getElementById("lesson-brand"));
    const watermarkY = -.24 * Math.cos(2 * Math.PI * time / 64);
    document.getElementById("lesson-watermark").setAttribute("transform", `translate(0 ${watermarkY})`);
    progress.value = time / data.duration;
    clock.textContent = `${formatTime(time / speed)} / ${formatTime(data.duration / speed)}`;
    let active = 0;
    for (let i = 1; i < data.chapters.length; i++) {
      if (data.chapters[i].start <= time) active = i;
    }
    chapterButtons.forEach((button, i) => {
      button.classList.toggle('active', i === active);
      if (i === active) button.setAttribute('aria-current', 'step');
      else button.removeAttribute('aria-current');
    });
    svg.dataset.time = time.toFixed(3);
    svg.dataset.chapter = data.chapters[active].id;
    updateLessonNavigation();
  }

  function pause() {
    playing = false;
    playButton.textContent = '播放';
    lastTimestamp = null;
    cancelAnimationFrame(animationFrame);
  }

  function animate(timestamp) {
    if (!playing) return;
    if (lastTimestamp !== null) time = Math.min(data.duration, time + (timestamp - lastTimestamp) / 1000 * speed);
    if (modeSelect.value === 'manual') time = Math.min(time, lessonPages[pageIndex].stop);
    lastTimestamp = timestamp;
    draw();
    if (modeSelect.value === 'manual' && time >= lessonPages[pageIndex].stop) {
      pause(); updateLessonNavigation(); return;
    }
    if (time >= data.duration) { pause(); return; }
    animationFrame = requestAnimationFrame(animate);
  }

  function play() {
    if (playing) return;
    if (time >= data.duration) time = 0;
    playing = true;
    lastTimestamp = null;
    playButton.textContent = '暂停';
    animationFrame = requestAnimationFrame(animate);
  }

  function seek(value) {
    time = Math.max(0, Math.min(data.duration, value));
    lastTimestamp = null;
    draw();
  }

  async function load() {
    const encoded = document.getElementById('animation-data').textContent.trim();
    const bytes = Uint8Array.from(atob(encoded), char => char.charCodeAt(0));
    const stream = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    data = JSON.parse(await new Response(stream).text());
    speed = data.defaultSpeed;
    speedSelect.replaceChildren();
    for (const value of [...new Set([1, 2, 3, 4, 5, 6, 8, 10, speed])].sort((a, b) => a - b)) {
      const option = document.createElement('option');
      option.value = value;
      option.textContent = `${value}×`;
      speedSelect.append(option);
    }
    speedSelect.value = String(speed);
    const brandViewBox = [...data.viewBox];
    brandViewBox[1] -= .5; brandViewBox[3] += .5;
    svg.setAttribute('viewBox', brandViewBox.join(' '));
    svg.style.background = data.background;
    data.chapters.forEach((chapter, i) => {
      const button = document.createElement('button');
      button.textContent = chapter.label || chapter.title || chapter.id;
      button.addEventListener('click', () => seek(chapter.start));
      chapterNav.append(button);
      chapterButtons.push(button);
    });
    document.querySelectorAll('[disabled]').forEach(control => control.disabled = false);
    document.getElementById('loading').hidden = true;
    document.getElementById('loading').style.display = 'none';
    playButton.addEventListener('click', toggleLessonPlayback);
    document.getElementById('restart').addEventListener('click', () => { pause(); pageIndex = 0; seek(lessonPages[0].start); play(); updateLessonNavigation(); });
    progress.addEventListener('input', () => seek(Number(progress.value) * data.duration));
    speedSelect.addEventListener('change', () => { speed = Number(speedSelect.value); lastTimestamp = null; draw(); });
    document.getElementById('fullscreen').addEventListener('click', async () => {
      const player = document.getElementById('player');
      try {
        if (document.fullscreenElement) await document.exitFullscreen();
        else await player.requestFullscreen();
      } catch {
        const status = document.getElementById('loading');
        status.textContent = '当前浏览器无法进入全屏';
        status.hidden = false;
        status.style.display = 'grid';
      }
    });
    document.addEventListener('keydown', event => {
      if (event.target instanceof HTMLInputElement || event.target instanceof HTMLSelectElement || event.target instanceof HTMLButtonElement) return;
      if (event.code === 'Space') { event.preventDefault(); toggleLessonPlayback(); }
      else if (event.code === 'ArrowRight') { event.preventDefault(); selectFragment(Math.min(lessonPages.length-1,pageIndex+1)); }
      else if (event.code === 'ArrowLeft') { event.preventDefault(); selectFragment(Math.max(0,pageIndex-1)); }
    });
    document.addEventListener('visibilitychange', () => { lastTimestamp = null; });
    draw();
    document.body.dataset.ready = 'true';
    if (window.parent !== window) window.parent.postMessage({type: 'manim-player-ready'}, '*');
    pause();
  }

const fragmentNames=["题目与选项", "五个根接成兄弟链", "画出恰好六层的树"];
let lastActive=-1,dragState=null,userFilmScroll=false,scrollTimer;
const film=document.getElementById('filmstrip'),timeline=document.getElementById('timeline'),rate=document.getElementById('ui-rate');
function selectFragment(i){pause();pageIndex=i;seek(lessonPages[i].start);play();syncProduct(true);}
function syncProduct(scroll=false){
 if(!data)return;
 document.getElementById('current-time').textContent=formatTime(time);document.getElementById('total-time').textContent=formatTime(data.duration);
 timeline.value=time/data.duration;document.getElementById('timeline-fill').style.width=(time/data.duration*100)+'%';
 const play=document.getElementById('ui-play');play.innerHTML=playing?'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>':'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4l14 8-14 8z"/></svg>';play.setAttribute('aria-label',playing?'暂停':'播放');play.title=play.getAttribute('aria-label');
 document.getElementById('ui-prev').disabled=pageIndex===0;document.getElementById('ui-next').disabled=pageIndex===lessonPages.length-1;
 document.getElementById('fragment-title').textContent=`${String(pageIndex+1).padStart(2,'0')} / ${String(lessonPages.length).padStart(2,'0')}　${fragmentNames[pageIndex]}`;
 [...film.children].forEach((card,i)=>{card.classList.toggle('active',i===pageIndex);card.setAttribute('aria-current',i===pageIndex?'step':'false');card.querySelector('.frame-line').style.width=(i===pageIndex?Math.max(0,Math.min(1,(time-lessonPages[i].start)/(lessonPages[i].stop-lessonPages[i].start)))*100:0)+'%'});
 if(pageIndex!==lastActive||scroll){const card=film.children[pageIndex];if(card&&!dragState&&!userFilmScroll){const l=card.offsetLeft-film.offsetLeft;if(l<film.scrollLeft||l+card.offsetWidth>film.scrollLeft+film.clientWidth)film.scrollTo({left:l-film.clientWidth/2+card.clientWidth/2,behavior:'smooth'});}lastActive=pageIndex;}
}
function initProductPlayer(){
 lessonPages.forEach((p,i)=>{const card=document.createElement('button');card.className='frame-card';card.setAttribute('aria-label',`第${i+1}片段：${fragmentNames[i]}`);card.innerHTML=`<div class="frame-image"><img src="frames/${i}.svg" alt="${fragmentNames[i]}" draggable="false"><span class="frame-time">${formatTime(p.start)}</span><span class="frame-line"></span></div><span class="frame-label"><span class="frame-num">${String(i+1).padStart(2,'0')}</span>${fragmentNames[i]}</span>`;card.onclick=()=>{if(!film.dataset.dragged)selectFragment(i)};film.append(card);const tick=document.createElement('i');tick.className='tick';tick.style.left=p.start/data.duration*100+'%';document.getElementById('timeline-ticks').append(tick)});
 modeSelect.value='auto';rate.value='2';speed=2;document.getElementById('ui-play').onclick=()=>{if(time>=data.duration-.05)seek(0);toggleLessonPlayback();syncProduct()};document.getElementById('ui-prev').onclick=()=>selectFragment(pageIndex-1);document.getElementById('ui-next').onclick=()=>selectFragment(pageIndex+1);
 rate.onchange=()=>{speed=Number(rate.value);lastTimestamp=null;play();syncProduct()};document.getElementById('ui-full').onclick=()=>document.getElementById('fullscreen').click();
 timeline.addEventListener('pointerdown',()=>{pause()});timeline.addEventListener('input',()=>{seek(Number(timeline.value)*data.duration);syncProduct()});timeline.addEventListener('change',()=>{play();syncProduct()});
 timeline.addEventListener('pointermove',e=>{const r=timeline.getBoundingClientRect(),fraction=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)),t=fraction*data.duration;let i=0;lessonPages.forEach((p,n)=>{if(t>=p.start)i=n});const preview=document.getElementById('scrub-preview');preview.style.display='block';preview.style.left=Math.max(87,Math.min(r.width-87,fraction*r.width))+'px';document.getElementById('scrub-image').src=`frames/${i}.svg`;document.getElementById('scrub-time').textContent=`${formatTime(t)} · ${fragmentNames[i]}`});timeline.addEventListener('pointerleave',()=>document.getElementById('scrub-preview').style.display='none');
 document.getElementById('film-left').onclick=()=>{userFilmScroll=true;film.scrollBy({left:-340,behavior:'smooth'})};document.getElementById('film-right').onclick=()=>{userFilmScroll=true;film.scrollBy({left:340,behavior:'smooth'})};
 film.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse'){userFilmScroll=true;return;}dragState={x:e.clientX,left:film.scrollLeft};delete film.dataset.dragged});film.addEventListener('pointermove',e=>{if(!dragState)return;const d=e.clientX-dragState.x;if(Math.abs(d)>5){userFilmScroll=true;film.dataset.dragged='true';film.classList.add('dragging');film.scrollLeft=dragState.left-d;e.preventDefault()}});window.addEventListener('pointerup',()=>{dragState=null;film.classList.remove('dragging');if(userFilmScroll)film.dispatchEvent(new Event('scroll'));setTimeout(()=>delete film.dataset.dragged,0)});
 film.addEventListener('wheel',e=>{if(film.scrollWidth<=film.clientWidth)return;userFilmScroll=true;if(Math.abs(e.deltaY)>Math.abs(e.deltaX)){film.scrollLeft+=e.deltaY;e.preventDefault()}},{passive:false});
 film.addEventListener('scroll',()=>{if(!userFilmScroll)return;clearTimeout(scrollTimer);scrollTimer=setTimeout(()=>{if(dragState)return;let closest=0,distance=Infinity;const center=film.scrollLeft+film.clientWidth/2;[...film.children].forEach((card,i)=>{const d=Math.abs(card.offsetLeft-film.offsetLeft+card.clientWidth/2-center);if(d<distance){distance=d;closest=i}});userFilmScroll=false;selectFragment(closest)},160)});
 const fitEmbed=()=>{if(window.frameElement&&!document.fullscreenElement)window.frameElement.style.height=Math.ceil(document.getElementById('player').getBoundingClientRect().height)+'px'};
 if(window.frameElement){new ResizeObserver(fitEmbed).observe(document.getElementById('player'));document.addEventListener('fullscreenchange',fitEmbed)}
 seek(0);play();syncProduct();document.body.dataset.productReady='true';function refresh(){syncProduct();requestAnimationFrame(refresh)}requestAnimationFrame(refresh);
}

  load().then(initProductPlayer).catch(error => {
    document.getElementById('loading').textContent = `动画加载失败：${error.message}`;
    document.body.dataset.error = error.message;
  });
</script>
