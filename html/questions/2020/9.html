<div class="content"><p>下列关于大根堆（至少含 2 个元素）的叙述中正确的是（ ）。</p>
<p>I. 可以将堆看成一颗完全二叉树；II. 可采用顺序存储方式保存堆；</p>
<p>III. 可以将堆看成一棵二叉排序树；IV. 堆中的次大值一定在根的下一层。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅 I，II</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 II，III</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 I，II，IV</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅 I，III，IV</span></div></div>
