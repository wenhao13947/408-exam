<div class="content"><p>关于 POP3，正确的是（ ）。</p>
<p>I 支持用户代理从邮件服务器读取邮件</p>
<p>II 支持用户代理向邮件服务器发送邮件</p>
<p>III 支持邮件服务器之间发送与接收邮件</p>
<p>IV 支持一条 TCP 连接收取多封邮件</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">I、IV</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">II、III</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">I、II、III</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">I、III、IV</span></div></div>
