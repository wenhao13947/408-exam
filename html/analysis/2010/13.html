<div class="content"><div class="analysis-content"><br/><p>本题的真正意图是考查 补码表示 的表示范围，而不是补码的乘法运算。若采用补码乘法规则计算出 4 个选项，是费力不讨好的做法，而且极容易出错。</p><p>8 位补码所能表示的整数范围为 -128~+127。将 4 个数全部转换为十进制：r1=-2，r2=-14，r3=-112，r4=-8，得 r2×r3=1568，远超出了表示范围，发生溢出。</p></div></div>
