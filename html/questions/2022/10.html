<div class="content"><p>使用二路归并排序对含 n 个元素的数组 M 进行排序时，二路归并操作的功能是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">将两个有序表合并为一个新的有序表</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">将 M 划分为两部分，两部分的元素个数大致相等</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">将 M 划分为 n 个部分，每个部分中仅含有一个元素</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">将 M 划分为两部分，一部分元素的值均小于另一部分元素的值</span></div></div>
