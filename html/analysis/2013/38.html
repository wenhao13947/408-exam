<div class="content"><div class="analysis-content"><br/>直通交换 在输入端口检测到一个数据帧时，检查帧首部，获取帧的目的地址，启动内部的动态查找表转换成相应的输出端口，在输入与输出交叉处接通，把数据帧直通到相应的端口，实现交换功能。直通交换方式只检查帧的目的地址，共 6B，所以最短的传输延迟是 6 × 8bit / 100Mbps = 0.48μs。</div></div>
