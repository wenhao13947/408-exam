<body>
<div class="content"><p>下列关于 DMA 方式的叙述中，正确的是（ ）。</p>
<p>Ⅰ. DMA 传送前由设备驱动程序设置传送参数</p>
<p>Ⅱ. 数据传送前由 DMA 控制器请求总线使用权</p>
<p>Ⅲ. 数据传送由 DMA 控制器直接控制总线完成</p>
<p>Ⅳ. DMA 传送结束后的处理由中断服务程序完成</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅Ⅰ、Ⅱ</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅Ⅰ、Ⅲ、Ⅳ</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅Ⅱ、Ⅲ、Ⅳ</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">Ⅰ、Ⅱ、Ⅲ、Ⅳ</span></div></div>


</body>
</html>
