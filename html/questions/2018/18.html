<div class="content"><p>按字节编址的计算机中，某 double 型数组 A 的首地址为 2000H，使用变址寻址和循环结构访问数组 A，保存数组下标的变址寄存器初值为 0，每次循环取一个数组元素，其偏移地址为变址值乘以 sizeof(double)，取完后变址寄存器内容自动加 1。若某次循环所取元素的地址为 2100H，则进入该次循环时变址寄存器的内容是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">25</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">32</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">64</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">100</span></div></div>
