<div class="content"><p>系统采用二级反馈队列调度算法进行进程调度。就绪队列 Q1 采用时间片轮转调度算法，时间片为 10ms；就绪队列 Q2 采用短进程优先调度算法；系统优先调度 Q1 队列中的进程，当 Q1 为空时系统才会调度 Q2 中的进程；新创建的进程首先进入 Q1;Q1 中的进程执行一个时间片后，若未结束，则转入 Q2。若当前 Q1，Q2 为空，系统依次创建进程 P1，P2 后即开始进程调度，P1,P2 需要的 CPU 时间分别为 30ms 和 20ms，则进程 P1，P2 在系统中的平均等待时间为（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">25ms</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">20ms</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">15ms</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">10ms</span></div></div>


</body>
