<div class="content"><p>单级中断系统中，中断服务程序内的执行顺序是（ ）。</p>
<p>I 保护现场    II 开中断</p>
<p>III 关中断    IV 保存断点</p>
<p>V 中断事件处理    VI 恢复现场    VII 中断返回</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">I→V→VI→II→VII</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">III→I→V→VII</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">III→IV→V→VI→VII</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">IV→I→V→VI→VII</span></div></div>
