<title>2018-第2题-题目</title>

<body>
<div class="content"><p>现有队列 Q 与栈 S，初始时 Q 中的元素依次是 1,2,3,4,5,6（1 在队头），S 为空。若仅允许下列 3 种操作：</p>
<p>① 出队并输出出队元素</p>
<p>② 出队并将出队元素入栈</p>
<p>③ 出栈并输出出栈元素</p>
<p>则不可能得到的输出序列是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">1，2，5，6，4，3</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">2，3，4，5，6，1</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">3，4，5，6，1，2</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">6，5，4，3，2，1</span></div></div>


</body>
</html>
