<div class="content"><div class="analysis-content"><br/>信号量 表示相关资源的当前可用数量。当信号量 K&gt;0 时，表示还有 K 个相关资源可用，所以该资源的可用个数是 1。而当信号量 K&lt;0 时，表示有 |K| 个进程在等待该资源。由于资源有剩余，可见没有其他进程等待使用该资源，故进程数为 0。</div></div>
