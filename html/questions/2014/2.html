
<!DOCTYPE html>

<title>2014-第2题-题目</title>

<link href="../../css/style.css" rel="stylesheet"/></head>
<body>
<div class="content"><p>假设栈初始为空，将中缀表达式 <code>a/b+(c*d-e*f)/g</code> 转换为等价的后缀表达式的过程中，当扫描到 <code>f</code> 时，栈中的元素依次是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content"><code>+(*-</code></span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content"><code>+(-*</code></span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content"><code>/+(*−*</code></span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content"><code>/+-*</code></span></div></div>


</body>
</html>
