<div class="content"><div class="analysis-content"><br/>由题目可知，计算机采用 3 通道存储器总线，存储器总线的工作频率为 1333MHz，即 1 秒内传送 1333M 次数据，总线宽度为 64 位即单条总线工作一次可传输 8 字节（Byte），因此存储器总线的总带宽 3×8×1333MB/s，约为 32GB/s，故答案选 B。</div></div>
