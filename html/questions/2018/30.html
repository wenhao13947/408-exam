<div class="content"><p>系统总是访问磁盘的某个磁道而不响应对其他磁道的访问请求，这种现象称为磁臂黏着。下列磁盘调度算法中，不会导致磁臂粘着的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">先来先服务 (FCFS)</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">最短寻道时间优先 (SSTF)</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">扫描算法 (SCAN)</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">循环扫描算法 (CSCAN)</span></div></div>
