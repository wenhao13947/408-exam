<div class="content"><div class="analysis-content"><br/><p>要使 R1 能够正确将分组路由到所有子网，则 R1 中需要有到 192.168.2.0/25 和 192.168.2.128/25 的路由，分别转换成二进制如下：</p><p>192.168.2.0: <u>11000000 10101000 00000010</u> 00000000</p><p>192.168.2.128: <u>11000000 10101000 00000010</u> 10000000</p><p>前 24 位都是相同的，于是可以 聚合 成超网 192.168.2.0/24, 子网掩码为前 24 位，即 255.255.255.0。下 一跳是与 R1 直接相连的 R2 的地址，因此是 192.168.1.2。</p></div></div>
