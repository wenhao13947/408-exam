<body>
<div class="content">
<p>某考试考查了课程 C1 和 C2，C1、C2 成绩及总成绩（C1、C2 成绩之和）均保存在数组 M 中。现需根据考生的总成绩从高到低进行排名，总成绩相同者的排名由 C1 成绩从高到低决定，C1 成绩也相同者的排名由初始相对次序决定。假设先按 C1 成绩对 M 排序，再按总成绩对 M 排序，能得到正确的排名结果，则下列算法中，采用的是</p><div class="option"><span class="opt-label">A.</span><span class="opt-content">基数排序</span></div><div class="option"><span class="opt-label">B.</span><span class="opt-content">快速排序</span></div><div class="option"><span class="opt-label">C.</span><span class="opt-content">希尔排序</span></div><div class="option"><span class="opt-label">D.</span><span class="opt-content">选择排序</span></div>
</div>
</body>
