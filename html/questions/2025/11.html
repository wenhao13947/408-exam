<div class="content"><p>对含 9 个关键字的初始序列进行排序，若序列的变化情况如下表所示，则下列排序算法中，采用的是（ ）。</p>
<table class="table td-initial"><thead><tr><th style="text-align:center"></th><th style="text-align:center"></th></tr></thead><tbody><tr><td style="text-align:center">初始序列</td><td style="text-align:center">5, 25, 40, 30, 10, 20, 45, 15, 35</td></tr><tr><td style="text-align:center">第 1 趟排序后的序列</td><td style="text-align:center">5, 10, 20, 30, 15, 35, 45, 25, 40</td></tr><tr><td style="text-align:center">第 2 趟排序后的序列</td><td style="text-align:center">5, 10, 15, 25, 20, 30, 40, 35, 45</td></tr></tbody></table>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">希尔排序</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">基数排序</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">归并排序</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">折半插入排序</span></div></div>
