<div class="content"><p>主机甲向主机乙发送一个 (SYN＝1, seq＝11220) 的 TCP 段，期望与主机乙建立 TCP 连接，若主机乙接受该连接请求，则主机乙向主机甲发送的正确的 TCP 段可能是</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">(SYN＝0, ACK＝0, seq＝11221, ack＝11221)</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">(SYN＝1, ACK＝1, seq＝11220, ack＝11220)</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">(SYN＝1, ACK＝1, seq＝11221, ack＝11221)</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">(SYN＝0, ACK＝0, seq＝11220, ack＝11220)</span></div></div>
