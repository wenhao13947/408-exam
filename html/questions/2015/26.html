<div class="content"><p>若系统 S1 采用死锁避免方法，S2 采用死锁检测方法。下列叙述中，正确的是（）。</p>
<p>Ⅰ、S1 会限制用户申请资源的顺序，而 S2 不会</p>
<p>Ⅱ、S1 需要进程运行所需的资源总量信息，而 S2 不需要</p>
<p>Ⅲ、S1 不会给可能导致死锁的进程分配资源，而 S2 会</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅Ⅰ、Ⅱ</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅Ⅱ、Ⅲ</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅Ⅰ、Ⅲ</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">Ⅰ、Ⅱ、Ⅲ</span></div></div>


</body>
