<div class="content"><p>下列有关基于时间片的进程调度的叙述中，错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">时间片越短，进程切换的次数越多，系统开销也越大</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">当前进程的时间片用完后，该进程状态由执行态变为阻塞态</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">时钟中断发生后，系统会修改当前进程在时间片内的剩余时间</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">影响时间片大小的主要因素包括响应时间、系统开销和进程数量等</span></div></div>
