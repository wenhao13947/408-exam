<div class="content"><div class="analysis-content"><br/>HDLC 协议 对比特串进行组帧时，HDLC 数据帧以位模式 0111 1110 标识每一个帧的开始和结束，因此在帧数据中凡是出现了 5 个连续的位“1”的时候，就会在输出的位流中填充一个“0”。因此组帧后的比特串为 0111 1100 0011 1110 10。</div></div>
