<div class="content"><p>某文件占 10 个磁盘块，现要把该文件磁盘块逐个读入主存缓冲区，并送用户区进行分析，假设一个缓冲区与一个磁盘块大小相同，把一个磁盘块读入缓冲区的时间为 100μs，将缓冲区的数据传送到用户区的时间是 50μs，CPU 对一块数据进行分析的时间为 50μs。在单缓冲区和双缓冲区结构下，读入并分析完该文件的时间分别是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">1500μs、1000μs</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">1550μs、1100μs</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">1550μs、1550μs</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">2000μs、2000μs</span></div></div>


</body>
