<div class="content"><p>某系统采用基于优先权的非抢占式进程调度策略，完成一次进程调度和进程切换的系统时间开销为 1us。在 T 时刻就绪队列中有 3 个进程 P1、P2 和 P3，其在就绪队列中的等待时间、需要的 CPU 时间和优先权如下表所示。若优先权值大的进程优先获得 CPU，从 T 时刻起系统开始进程调度，则系统的平均周转时间为（）。</p>
<table class="table td-initial"><thead><tr><th>进程</th><th>等待时间</th><th>需要的 CPU 时间</th><th>优先级</th></tr></thead><tbody><tr><td>P1</td><td>30us</td><td>12us</td><td>10</td></tr><tr><td>P2</td><td>15us</td><td>24us</td><td>30</td></tr><tr><td>P3</td><td>18us</td><td>36us</td><td>20</td></tr></tbody></table>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">54us</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">73us</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">74us</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">75us</span></div></div>
