<div class="content"><div class="analysis-content"><br/>总线 是在两个或多个设备之间进行通信的传输介质，A 正确。同步总线 是指总线通信的双方采用同一个时钟信号，但是一次总线事务不一定在一个时钟周期内完成，即时钟频率不一定等于工作频率，B 正确。异步总线 采用握手的方式进行通信，每次握手的过程完成一次通信，但一次通信往往会交换多位而非一位数据，C 错误。突发总线传输事务 是指发送方在传输完地址后，连续进行若干次数据的发送，D 正确。</div></div>
