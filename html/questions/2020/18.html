<div class="content"><p>下列关于“自陷”（Trap，也称陷阱）的叙述中错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">自陷是通过陷阱指令预先设定的一类外部中断事件；</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">自陷可用于实现程序调试时的断点设置和单步跟踪；</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">自陷发生后 CPU 将转去执行操作系统内核相应程序；</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">自陷处理完成后返回到陷阱指令的下一条指令执行。</span></div></div>
