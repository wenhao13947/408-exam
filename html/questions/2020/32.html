<body>
<div class="content"><p>下列准则中，实现临界区互斥机制必须遵循的是（ ）。</p>
<p>Ⅰ、两个进程不能同时进入临界区</p>
<p>Ⅱ、允许进程访问空闲的临界资源</p>
<p>Ⅲ、进程等待进入临界区的时间是有限的</p>
<p>Ⅳ、不能进入临界区的执行态进程立即放弃 CPU</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅Ⅰ、Ⅳ</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅Ⅱ、Ⅲ</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅Ⅰ、Ⅱ、Ⅲ</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅Ⅰ、Ⅲ、Ⅳ</span></div></div>


</body>
