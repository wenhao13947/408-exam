<div class="content"><div class="analysis-content"><br/>数据线有 32 根，也就是一次可以传送 32bit/8 = 4B 的数据，66MHz 意味着有 66M 个时钟周期，而每个时钟周期传送两次数据，可知总线每秒传送的最大数据量为 66Mx2x4B=528MB，所以总线的最大数据传输率为 528MB/s，选 C。</div></div>
