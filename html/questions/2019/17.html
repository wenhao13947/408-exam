<div class="content"><p>某指令功能为 <code>R[r2] ← R[r1] + M[R[r0]]</code>，其两个源操作数分别采用寄存器、寄存器间接寻址方式。对于下列给定部件，该指令在取数及执行过程中需要用到的是（ ）。</p>
<p>I.通用寄存器组（GPRs）      II. 算术逻辑单元（ALU）</p>
<p>III.存储器（Memory）      IV. 指令译码器（ID）</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅 I、II</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 I、II、III</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 II、III、IV</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅 I、III、IV</span></div></div>
