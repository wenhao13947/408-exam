<body>
<div class="content"><p>若某单处理器多进程系统中有多个就绪态进程，则下列关于处理机调度的叙述中，错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">在进程结束时能进行处理机调度</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">创建新进程后能进行处理机调度</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">在进程处于临界区时不能进行处理机调度</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">在系统调用完成并返回用户态时能进行处理机调度</span></div></div>
