<div class="content"><p>在采用“取指、译码/取数、执行、访存、写回”5 段流水线的 RISC 处理器中，下列关于指令流水线数据冒险处理的叙述中，错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">相邻两条指令中的操作数相关可能引起数据冒险</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">在数据相关的指令间插入“气泡”能避免数据冒险</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">所有数据冒险都可以通过加入转发（旁路）电路解决</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">所有数据冒险都能通过调整指令顺序和插入 nop 指令解决</span></div></div>
