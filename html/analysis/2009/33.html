<div class="content"><div class="analysis-content"><br/>传输层 提供应用进程间的逻辑通信（通过端口号），即端到端的通信。而数据链路层负责相邻结点之间的通信，这个结点包括了交换机和路由器等数据通信 设备，这些设备 不能称为端系统。网络层负责主机到主机的逻辑通信。因此选 B。</div></div>
