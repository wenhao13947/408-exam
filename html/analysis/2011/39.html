<div class="content"><div class="analysis-content"><br/>本题考查三次握手，在确认报文段中，同步位 SYN 和确认位 ACK 必须都是 1；返回的确认号 seq 是甲发送的初始序号 seq=11220 加 1，即 ack= 11221；同时乙也要选择并消耗一个初始序号 seq，seq 值由乙的TCP 进程任意给出，它与确认号、请求报文段的序号没有任何关系。</div></div>
