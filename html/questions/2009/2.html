<div class="content"><p>设栈 S 和队列 Q 的初始状态均为空，元素 a, b, c, d, e, f, g 依次进入栈 S 。若每个元素出栈后立即进入队列 Q，且 7 个元素出队的顺序是 b, d, c, f, e, a, g，则栈 S 的容量至少是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">1</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">2</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">3</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">4</span></div></div>
