<body>
<div class="content"><p>若一个用户进程通过 read 系统调用读取一个磁盘文件中的数据，则下列关于此过程的叙述中，正确的是（ ）。</p>
<p>Ⅰ. 若该文件的数据不在内存中，则该进程进入睡眠等待状态</p>
<p>Ⅱ. 请求 read 系统调用会导致 CPU 从用户态切换到核心态</p>
<p>Ⅲ. read 系统调用的参数应包含文件的名称</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅Ⅰ、Ⅱ</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅Ⅰ、Ⅲ</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅Ⅱ、Ⅲ</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">Ⅰ、Ⅱ和Ⅲ</span></div></div>


</body>
