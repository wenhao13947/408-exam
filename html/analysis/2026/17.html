<div class="content"><div class="analysis-content"><p><strong>【解析】</strong></p><p>Ⅰ条件跳转指令在条件不满足时，按存放顺序执行下一条指令。</p><p>Ⅱ过程调用指令的目标入口地址可能恰好是顺序存放的下一条指令地址，也可能按存放顺序继续执行。</p><p>Ⅲ陷阱指令转入陷阱处理程序；Ⅳ过程返回指令转到先前保存的返回地址，按题目所问的通常指令流程，不属于按存放顺序执行下一条指令。</p><p>因此选择 A（仅Ⅰ、Ⅱ）。</p></div></div>
