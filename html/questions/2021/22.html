<div class="content"><p>下列是关于多重中断系统中 CPU 响应中断的叙述，其中错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅在用户态（执行用户程序）下，CPU 才能检测和响应中断</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">CPU 只有在检测到中断请求信号后，才会进入中断响应周期</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">进入中断响应周期时，CPU 一定处于中断允许（开中断）状态</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">若 CPU 检测到中断请求信号，则一定存在未被屏蔽的中断源请求信号</span></div></div>


</body>
