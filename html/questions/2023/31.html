<div class="content"><p>若文件 F 仅被进程 P 打开并访问，则当进程 P 关闭 F 时，下列操作中，文件系统需要完成的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">删除目录中文件 F 的目录项</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">释放 F 的索引节点所占的内存空间</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">释放 F 的索引节点所占的外存空间</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">将文件磁盘索引节点中的链接计数减 1</span></div></div>
