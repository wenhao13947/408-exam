
<!DOCTYPE html>

<body>
<div class="content"><p>已知带头结点的非空单链表 <code>L</code> 的头指针为 <code>h</code>，指针 <code>p</code> 指向 <code>L</code> 中间的一个链表结点（不是第一个和最后一个结点）。<code>q=p-&gt;next</code>，<code>p-&gt;next=q-&gt;next</code>，<code>q-&gt;next=h-&gt;next</code>，<code>h-&gt;next=q</code>。这段代码的功能是（）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">把 <code>q</code> 指向的结点插入到 <code>p</code> 的后面</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">把 <code>p</code> 指向的结点插入到 <code>q</code> 的后面</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">把 <code>p</code> 指向的结点插入到 <code>h</code> 的后面</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">把 <code>q</code> 指向的结点插入到 <code>h</code> 的后面</span></div></div>


</body>
</html>
