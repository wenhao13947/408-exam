<body>
<div class="content"><p>假设系统中有 4 个同类资源，进程 P1、P2 和 P3 需要的资源数分别为 4、3 和 1，P1、P2 和 P3 已申请到的资源数分别为 2、1 和 0，则执行安全性检测算法的结果是（）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">不存在安全序列，系统处于不安全状态</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">存在多个安全序列，系统处于安全状态</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">存在唯一安全序列 P3、P1、P2，系统处于安全状态</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">存在唯一安全序列 P3、P2、P1，系统处于安全状态</span></div></div>


</body>
