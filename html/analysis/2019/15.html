<div class="content"><div class="analysis-content"><br/>注意，内存地址是无符号数。操作数采用基址寻址方式，EA=(BR)+A，基址寄存器 BR 的内容为 F000 0000H，形式地址用补码表示为 FF12H，即 1111 1111 0001 0010B，因此有效地址为 F000 0000H +(-00EEH) = EFFF FF12H。计算机采用 大端方式 编址，故低位字节存放在字的高地址处，机器数一共占 4 字节，该操作数的 LSB 所在的地址是 EFFF FF12H + 3 = EFFF FF15H，所以选 D。</div></div>
