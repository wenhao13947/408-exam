<div class="content"><p>下列关于进程和线程的叙述中，正确的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">不管系统是否支持线程，进程都是资源分配的基本单位</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">线程是资源分配的基本单位，进程是调度的基本单位</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">系统级线程和用户级线程的切换都需要内核的支持</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">同一进程中的各个线程拥有各自不同的地址空间</span></div></div>
