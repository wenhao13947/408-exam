<div class="content"><p>p、q、v 都是二叉树 T 中的结点，二叉树 T 的中序遍历为 ···, p，v，q，··· ，其中 v 有两个孩子结点，则下列说法正确的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">p 没右孩子，q 没左孩子</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">p 没右孩子，q 有左孩子</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">p 有右孩子，q 没左孩子</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">p 有右孩子，q 有左孩子</span></div></div>
