<title>2022-第2题-题目</title>

<body>
<div class="content"><p>给定有限符号集 S, in 和 out 均为 S 中所有元素的任意排列。对于初始为空的栈 ST, 下列叙述中，正确的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">若 in 是 ST 的入栈序列，则不能判断 out 是否为其可能的出栈序列</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">若 out 是 ST 的出栈序列，则不能判断 in 是否为其可能的入栈序列</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">若 in 是 ST 的入栈序列，out 是对应 in 的出栈序列，则 in 与 out 一定不同</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">若 in 是 ST 的入栈序列，out 是对应 in 的出栈序列，则 in 与 out 可能互为倒序</span></div></div>


</body>
