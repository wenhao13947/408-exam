
<!DOCTYPE html>

<title>2020-第22题-题目</title>

<link href="../../css/style.css" rel="stylesheet"/></head>
<body>
<div class="content"><p>若设备采用周期挪用 DMA 方式进行输入输出，每次 DMA 传送的数据块大小为 512 字节，相应的 I/O 接口中有一个 32 位数据缓冲寄存器，对于数据输入过程，下列叙述中错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">每准备好 32 位数据，DMA 控制器就发出一次总线请求；</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">相对于 CPU，DMA 控制器的总线使用权的优先级更高；</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">在整个数据块的传送过过程中，CPU 不可以访问主存储器；</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">数据块传送结束时，会产生“DMA 传送结束”的中断请求。</span></div></div>


</body>
</html>
