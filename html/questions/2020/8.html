<div class="content"><p>若使 AOE 网估算工程进度则下列叙述中正确的是（ ）。</p>

<div class="option"><span class="opt-label">D.</span><span class="opt-content">缩短任一关键活动的时间将会缩短工程的工期</span></div></div>
