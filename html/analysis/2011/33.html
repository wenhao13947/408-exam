<div class="content"><div class="analysis-content"><br/>TCP/IP 的网络层向上只提供简单灵活的、无连接的、尽最大努力交付的数据报服务。考查 IP
首部，如果是面向连接的，那么应有用于建立连接的字段，但是没有；如果提供可靠的服务，那
么至少应有序号和校验 和两个字段，但是 IP 分组头中也没有（IP 首部中只是首部校验和）。通常
有连 接、可靠 的应用是由运输层的 TCP 实现的。</div></div>
