<div class="content"><div class="analysis-content"><br/>主机 00-el-d5-00-23-a1 向 00-el-d5-00-23-c1 发送数据帧时，交换机 转发表中没有 00-el-d5-00-23-c1 这项，所以向除 1 接口外的所有接口广播这帧，即 2、3 端口会转发这帧，同时因为转发表中并没有 00-e1-d5-00-23-a1 这项，所以转发表会把（目的地址 00-el-d5-00-23-a1，端口 1）这项加入转发表。而当 00-el-d5-00-23-c1 向 00-e1-d5-00-23-a1 发送确认帧时，由于转发表已经有 00-el-d5-00-23-a1 这项，所以交换机只向 1 端口转发，选 B。</div></div>
