<div class="content"><div class="analysis-content"><br/>冯·诺依曼计算机 的功能部件包括输入设备、输出设备、存储器、运算器和控制器，程序的功能都通过中央处理器（运算器和控制器）执行指令，A 正确。指令和数据以同等地位存于存储器内，形式上无差别，只在程序执行时具有不同的含义，B 正确。指令在地址访问，数据由指令的地址码指出，除立即寻址，数据均存放在存储器内，C 错误。在程序执行前，指令和数据需预先存放在存储器中，中央处理器可以从存储器存取代码，D 正确。</div></div>
