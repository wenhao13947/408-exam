<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅Ⅰ、Ⅱ、Ⅲ</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅Ⅲ、Ⅳ</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">Ⅰ、Ⅱ、Ⅲ和Ⅳ</span></div></div>
