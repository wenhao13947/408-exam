<div class="content"><div class="analysis-content"><br/>应用层数据交给传输层时，放在报文段的数据部分。UDP 首部有 8B，TCP 首部最短有 20B。为了达到最大传输效率，通过 UDP 传输时，总长度为 20B，最大传输效率是 12B/20B=60% 通过 TCP 传输时，总长度为 32B，最大传输效率是 12B/32B=37.5%。</div></div>
