<div class="content"><div class="analysis-content"><br/>IEEE754 单精度浮点数格式 中依次为数符 1 位、阶码 8 位（偏置值 127)、尾数
23 位（隐藏 1 位）。
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.7278em;vertical-align:-.0833em"></span><span class="mord">−</span><span class="mord">0.4375</span><span class="mspace" style="margin-right:.2778em"></span><span class="mrel">=</span><span class="mspace" style="margin-right:.2778em"></span></span><span class="base"><span class="strut" style="height:.7278em;vertical-align:-.0833em"></span><span class="mord">−</span><span class="mord">1.75</span><span class="mspace" style="margin-right:.2222em"></span><span class="mbin">×</span><span class="mspace" style="margin-right:.2222em"></span></span><span class="base"><span class="strut" style="height:.8141em"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:.8141em"><span style="top:-3.063em;margin-right:.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mtight"><span class="mord mtight">−</span><span class="mord mtight">2</span></span></span></span></span></span></span></span></span></span></span></span>
，保证小数点前是 1。根据单精度浮点数格式，数符
为 1；阶码为移码表示，-2+127=125，写成 8 位二进制数为 01111101；尾数隐藏小数点前
的 1，剩下的 0.75 写成二进制数为 0.11，所以尾数部分是 1100…0。该浮点数的二进制格式为
1011111011100000000000000000000，对应的十六进制格式为 BEE00000H。</div></div>
