<div class="content"><div class="analysis-content"><br/>该指令的两个源操作数分别采用 寄存器寻址 和 寄存器间接寻址，因此在取数阶段需要用到通用寄存器组和存储器；在执行阶段，两个源操作数相加需要用到算术逻辑单元；而指令译码器用于操作码字段进行译码，向控制器提供特定的操作信号，在取数及执行阶段用不到，所以答案选 B。</div></div>
