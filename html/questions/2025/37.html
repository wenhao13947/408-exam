<div class="content"><p>假设路由器实现 NAT 功能，内网中主机 H 的 IP 地址为 192.168.1.5/24。若 H 运行某应用向 internet 发送一个 UDP 报文段，则路由器在转发封装该 UDP 报文段的 IP 数据报的过程中，UDP 报文的首部字段会被修改的是（ ）。</p>
<p>I 源端口号</p>
<p>II 目的端口号</p>
<p>III 总长度</p>
<p>IV 校验和</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅 I、III</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 I、IV</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 lI、III</span></div>
