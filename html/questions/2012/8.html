<title>2012-第8题-题目</title>

<body>
<div class="content"><p>下列关于最小生成树的叙述中，正确的是（）。</p>
<p>Ⅰ．最小生成树的代价唯一</p>
<p>Ⅱ．所有权值最小的边一定会出现在所有的最小生成树中</p>
<p>Ⅲ．使用普里姆（Prim）算法从不同顶点开始得到的最小生成树一定相同</p>
<p>Ⅳ．使用普里姆算法和克鲁斯卡尔（Kruskal）算法得到的最小生成树总不相同</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅Ⅰ</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅Ⅱ</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅Ⅰ、Ⅲ</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅Ⅱ、Ⅳ</span></div></div>


</body>
</html>
