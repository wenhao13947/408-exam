<div class="content"><p>主机甲和主机乙之间已建立了一个 TCP 连接，TCP 最大段长度为 1000 字节。若主机甲的当前拥塞窗口为 4000 字节，在主机甲向主机乙连续发送两个最大段后，成功收到主机乙发送的第一个段的确认段，确认段中通告的接收窗口大小为 2000 字节，则此时主机甲还可以向主机乙发送的最大字节数是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">1000</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">2000</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">3000</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">4000</span></div></div>


</body>
