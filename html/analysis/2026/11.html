<body><div class="content"><div class="analysis-content"><p><strong>【解析】</strong></p>
<p>Ⅰ正确：在初始归并段数和其他条件相同时，增大归并路数 k 可能减少归并趟数 d。</p>
<p>Ⅱ错误：归并趟数与初始归并段数有关，初始归并段数变化可能改变 d。</p>
<p>Ⅲ不作为必然结论：采用置换-选择排序生成初始归并段时，初始归并段长度可能超过内存工作区容量，不能笼统地说可用内存大小限制初始归并段的最大长度。</p>
<p>因此正确的是仅Ⅰ，选择 A。</p></div></div></body>
