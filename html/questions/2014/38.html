<div class="content"><p>主机甲和主机乙已建立了 TCP 连接，甲始终以 MSS=1KB 大小的段发送数据，并一直有数据发送；乙每收到一个数据段都会发出一个接收窗口为 10KB 的确认段。若甲在 t 时刻发生超时时拥塞窗口为 8KB，则从 t 时刻起，不再发生超时的情况下，经过 10 个 RTT 后，甲的发送窗口是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">10KB</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">12KB</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">14KB</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">15KB</span></div></div>
