<title>2018-第19题-题目</title>

<body>
<div class="content"><p>减法指令 <code>sub R1,R2,R3</code> 的功能为 <code>(R1)-(R2)→R3</code>，该指令执行后将生成进位/借位标志 CF 和溢出标志 OF。若 <code>(R1)=FFFFFFFFH</code>，<code>(R2)=FFFFFFF0H</code>，则该减法指令执行后，CF 与 OF 分别为（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">CF=0，OF=0</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">CF=1，OF=0</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">CF=0，OF=1</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">CF=1，OF=1</span></div></div>


</body>
</html>
