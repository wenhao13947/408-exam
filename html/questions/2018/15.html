<div class="content"><p>某 32 位计算机按字节编址，采用小端（Little Endian）方式。若语句 <code>int i=0</code> 对应指令的机器代码为 <code>C7 45 FC 00 00 00 00</code>，则语句 <code>int i=-64</code> 对应指令的机器代码是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">C7 45 FC C0 FF FF FF</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">C7 45 FC 0C FF FF FF</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">C7 45 FC FF FF FF C0</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">C7 45 FC FF FF FF 0C</span></div></div>


</body>
