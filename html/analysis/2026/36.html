<p>正确答案：B</p><p>H1、H2、H3 属于 VLAN1，H4、H5、H6 属于 VLAN2。F1 是从 H1 到 H3 的同 VLAN 单播，H3 能收到。F2 从 VLAN2 的 H5 发往 VLAN1 的 H3，不能跨 VLAN 转发。F3 是 H2 在 VLAN1 内的广播，H3 能收到。F4 是 H6 在 VLAN2 内的广播，不会进入 VLAN1。因此仅 F1、F3，选 B。</p>
