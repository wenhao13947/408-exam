<div class="content"><p>假设主机 H 通过 HTTP/1.1 请求浏览某 Web 服务器 S 上的 Web 页 news408.html, news408.html 引用了同目录下的 1 幅图像，news408.html 文件大小为 1 MSS（最大段长），图像文件大小为 3 MSS, H 访问 S 的往返时间 RTT = 10 ms, 忽略 HTTP 响应报文的首部开销和 TCP 段传输时延。若 H 已完成域名解析，则从 H 请求与 S 建立 TCP 连接时刻起，到接收到全部内容止，所需的时间至少 是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">30ms</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">40ms</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">50ms</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">60ms</span></div></div>


</body>
