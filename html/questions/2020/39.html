<div class="content"><p>若主机甲与主机乙建立 TCP 连接时发送的 SYN 段中的序号为 1000，在断开连接时，甲发送给乙的 FIN 段中的序号为 5001，则在无任何重传的情况下，甲向乙已经发送的应用层数据的字节数为：</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">4002；</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">4001；</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">4000；</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">3999；</span></div></div>
