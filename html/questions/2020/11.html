<body>
<div class="content"><p>对大部分元素已有序的数组进行排序时，直接插入排序比简单选择排序效率更高，其原因是（ ）。</p>
<p>I. 直接插入排序过程中元素之间的比较次数更少</p>
<p>II. 直接插入排序过程中所需要的辅助空间更少</p>
<p>III. 直接插入排序过程中元素的移动次数更少</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅 I</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 III</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 I，II</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅 I，II 和 III</span></div></div>


</body>
