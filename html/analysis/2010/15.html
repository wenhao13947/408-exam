<div class="content"><div class="analysis-content"><br/><p>本题考查 主存容量的扩展，用 2Kx4 位的芯片组成一个 8Kx8 位存储器，共需 8 片 2Kx4 位的芯片，分为 4 组，每组由 2 片 2Kx4 位的芯片并联组成 2Kx8 位的芯片，各组芯片的地址分配如下：</p><ul><li>第一组（2 个芯片并联）：0000H ~ 07FFH</li><li>第二组（2 个芯片并联）：0800H ~ 0FFFH</li><li>第三组（2 个芯片并联）：1000H ~ 17FFH</li><li>第四组（2 个芯片并联）：1800H ~ 1FFFH</li></ul><p>地址 OBIFH 所在的芯片属于第二组，故其所在 芯片的最小地址为 0800H。</p></div></div>
