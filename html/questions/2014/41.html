<div class="content"><p>二叉树的带权路径长度（WPL）是二叉树中所有叶结点的带权路径长度之和。给定一棵二叉树 T，采用二叉链表存储，结点结构为：</p>
<table style="border-collapse:collapse;margin:10px 0 12px 0;text-align:center;">
<tr>
<th style="border:1px solid #333;padding:4px 18px;">left</th>
<th style="border:1px solid #333;padding:4px 18px;">weight</th>
<th style="border:1px solid #333;padding:4px 18px;">right</th>
</tr>
</table>
<p>其中叶结点的 weight 域保存该结点的非负权值。设 root 为指向 T 的根结点的指针，请设计求 T 的 WPL 的算法，要求：</p>
<p>(1) 给出算法的基本设计思想；</p>
<p>(2) 使用 C 或 C++ 语言，给出二叉树结点的数据类型定义；</p>
<p>(3) 根据设计思想，采用 C 或 C++ 语言描述算法，关键之处给出注释。</p></div>
