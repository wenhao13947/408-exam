<div class="content"><p>下列关于死锁的叙述中，正确的是（ ）。</p>
<p>Ⅰ、可以通过剥夺进程资源解除死锁</p>
<p>Ⅱ、死锁的预防方法能确保系统不发生死锁</p>
<p>Ⅲ、银行家算法可以判断系统是否处于死锁状态</p>
<p>Ⅳ、当系统出现死锁时，必然有两个或两个以上的进程处于阻塞态</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅Ⅱ、Ⅲ</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅Ⅰ、Ⅱ、Ⅳ</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅Ⅰ、Ⅱ、Ⅲ</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅Ⅰ、Ⅲ、Ⅳ</span></div></div>
