<body>
<div class="content"><p>若元素 a, b, c, d, e, f 依次进栈，允许进栈、退栈操作交替进行，但不允许连续三次进行退栈操作，则不可能得到的出栈序列是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">d, c, e, b, f, a</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">c, b, d, a, e, f</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">b, c, a, e, f, d</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">a, f, e, d, c, b</span></div></div>


</body>
