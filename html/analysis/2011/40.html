<div class="content"><div class="analysis-content"><br/>TCP 首部的序号字段是指本报文段数据部分的第一个字节的序号，而确认号是期待收到对方下一个报文段的第一个字节的序号。第三个段的序号为 900，则第二个段的序号为 900-400=500，现在主机乙期待收到第二个段，故发给甲的确认号是 500。</div></div>
