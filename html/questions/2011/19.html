<title>2011-第19题-题目</title>

<link href="../../css/style.css" rel="stylesheet"/></head>
<body>
<div class="content"><p>假定不采用 Cache 和指令预取技术，且机器处于“开中断”状态，则在下列有关指令执行的叙述中，错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">每个指令周期中 CPU 都至少访问内存一次</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">每个指令周期一定大于或等于一个 CPU 时钟周期</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">空操作指令的指令周期中任何寄存器的内容都不会被改变</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">当前程序在每条指令执行结束时都可能被外部中断打断</span></div></div>


</body>
</html>
