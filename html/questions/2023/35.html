<title>2023-第35题-题目</title>

<body>
<div class="content"><p>假设通过同一信道，数据链路层分别采用停等协议、GBN 协议和 SR 协议（发送窗口和接收窗口相等）传输数据，三个协议数据帧长相同，忽略确认帧长度，帧序号位数为 3 比特。若对应三个协议的发送方最大信道利用率分别是 U1、U2 和 U3，则 U1、U2 和 U3 满足的关系是（ ）</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">U1 ≤ U2 ≤ U3</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">U1 ≤ U3 ≤ U2</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">U2 ≤ U3 ≤ U1</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">U3 ≤ U2 ≤ U1</span></div></div>


</body>
