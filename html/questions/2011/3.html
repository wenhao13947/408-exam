<title>2011-第3题-题目</title>

<body>
<div class="content"><p>已知循环队列存储在一维数组 <code>A[0..n-1]</code>中，且队列非空时 <code>front</code> 和 <code>rear</code> 分别指向队头元素和队尾元素。若初始时队列空，且要求第一个进入队列的元素存储在 <code>A[0]</code>处，则初始时 <code>front</code> 和 <code>rear</code> 的值分别是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">0，0</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">0，n-1</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">n-1，0</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">n-1，n-1</span></div></div>


</body>
</html>
