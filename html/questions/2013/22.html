<body>
<div class="content"><p>下列关于中断 I/O 方式和 DMA 方式比较的叙述中，错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">中断 I/O 方式请求的是 CPU 处理时间，DMA 方式请求的是总线使用权</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">中断响应发生在一条指令执行结束后，DMA 响应发生在一个总线事务完成后</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">中断 I/O 方式下数据传送通过软件完成，DMA 方式下数据传送由硬件完成</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">中断 I/O 方式适用于所有外部设备，DMA 方式仅适用于快速外部设备</span></div></div>


</body>
</html>
