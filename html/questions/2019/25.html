<body>
<div class="content"><p>下列关于系统调用的叙述中，正确的是（ ）。</p>
<p>Ⅰ.在执行系统调用服务程序的过程中，CPU 处于内核态</p>
<p>Ⅱ.操作系统通过提供系统调用避免用户程序直接访问外设</p>
<p>Ⅲ.不同的操作系统为应用程序提供了统一的系统调用接口</p>
<p>Ⅳ.系统调用是操作系统内核为应用程序提供服务的接口</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅Ⅰ、Ⅳ</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅Ⅱ、Ⅲ</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅Ⅰ、Ⅱ、Ⅳ</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">Ⅰ、Ⅲ、Ⅳ</span></div></div>


</body>
