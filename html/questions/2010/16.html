<div class="content"><p>下列有关 RAM 和 ROM 的叙述中，正确的是（ ）。</p>
<p>I. RAM 是易失性存储器，ROM 是非易失性存储器</p>
<p>II. RAM 和 ROM 都采用随机存取方式进行信息访问</p>
<p>III. RAM 和 ROM 都可用作 Cache</p>
<p>IV. RAM 和 ROM 都需要进行刷新</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅 I 和 II</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 II 和 III</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 I,II 和 IV</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅 II，III 和 IV</span></div></div>


</body>
