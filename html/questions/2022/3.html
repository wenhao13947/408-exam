<title>2022-第3题-题目</title>

<body>
<div class="content"><p>若结点 p 与 q 在二叉树 T 的中序遍历序列中相邻，且 p 在 q 之前，则下列 p 与 q 的关系中，不可能的是（ ）。</p>
<p>I. q 是 p 的双亲</p>
<p>II. q 是 p 的右孩子</p>
<p>III. q 是 p 的右兄弟</p>
<p>IV. q 是 p 的双亲的双亲</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅 I</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 III</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 II、III</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅 II、IV</span></div></div>


</body>
</html>
