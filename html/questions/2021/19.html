<div class="content"><p>下列关于总线的叙述中，错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">总线是在两个或多个部件之间进行数据交换的传输介质</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">同步总线由时钟信号定时，时钟频率不一定等于工作频率</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">异步总线由握手信号定时，一次握手过程完成一位数据交换</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">突发（Burst）传送总线事务可以在总线上连续传送多个数据</span></div></div>
