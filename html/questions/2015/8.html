<body>
<div class="content"><p>已知字符串 <code>s</code> 为 “<code>abaabaabacacaabaabcc</code>”，模式串 <code>t</code> 为 “<code>abaabc</code>”。采用 KMP 算法进行匹配，第一次出现“失配”（<code>s[i]</code> ≠ <code>t[j]</code>）时，<code>i = j = 5</code>，则下次开始匹配时，<code>i</code> 和 <code>j</code> 的值分别是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content"><code>i = 1, j = 0</code></span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content"><code>i = 5, j = 0</code></span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content"><code>i = 5, j = 2</code></span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content"><code>i = 6, j = 2</code></span></div></div>


</body>
