<div class="content"><p>若栈 S1 中保存整数，栈 S2 中保存运算符，函数 F() 依次执行下述各步操作：</p>
<ol><li>从 S1&nbsp;中依次弹出两个操作数 a 和 b;</li><li>从 S2&nbsp;中弹出一个运算符 op;</li><li>执行相应的运算 b op a;</li><li>将运算结果压入 S1&nbsp;。</li></ol>
<p>假定 S1 中的操作数依次是 5,8,3,2（2 在栈顶），S2 中的运算符依次是 ×,−,+ （ + 在栈顶）。调用 3 次 F() 后，S1 栈顶保存的值是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">-15</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">15</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">-20</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">20</span></div></div>


</body>
