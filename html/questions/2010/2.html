<div class="content"><p>某队列允许在其两端进行入队操作，但仅允许在一端进行出队操作，若元素 a, b, c, d, e 依次入此队列后再进行出队操作，则不可能得到的出队序列是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">b, a, c, d, e</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">d, b, a, c, e</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">d, b, c, a, e</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">e, c, b, a, d</span></div></div>


</body>
