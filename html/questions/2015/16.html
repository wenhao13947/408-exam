<div class="content"><p>假定编译器将赋值语句 “<code>x=x+3;</code>” 转换为指令 “<code>add xaddr, 3</code>”，其中 <code>xaddr</code> 是 <code>x</code> 对应的存储单元地址。若执行该指令的计算机采用页式虚拟存储管理方式，并配有相应的 TLB，且 Cache 使用直写（Write Through）方式，则完成该指令功能需要访问主存的次数至少是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">0</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">1</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">2</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">3</span></div></div>


</body>
