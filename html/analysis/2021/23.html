<div class="content"><div class="analysis-content"><br/><p>在 内核态 下，CPU 可执行任何指令，在用户态下 CPU 只能执行非特权指令，而特权指令只能在内核态下执行。常见的 特权指令 有：</p><ol><li>有关对 IO 设备操作的指令；</li><li>有关访问程序状态的指令；</li><li>存取特殊寄存器指令；</li><li>其他指令。</li></ol><p>A、C 和 D 都是提供给用户使用的指令，可以在用户态执行，只是可能会使 CPU 从用户态切换到内核态。</p></div></div>
