<title>2019-第25题-解析</title>

<body>
<div class="content"><div class="analysis-content"><br/>用户可以在用户态调用操作系统的服务，但执行具体的系统调用服务程序是处于内核态的，Ⅰ正确：设备管理属于操作系统的职能之一，包括对输入/输出设备的分配、初始化、维护等，用户程序需要通过系统调用使用操作系统的设备管理服务，Ⅱ正确：操作系统不同，底层逻辑、实现方式均不相同，为应用程序提供的系统调用接口也不同，Ⅲ错误：系统调用是用户在程序中调用操作系统提供的子功能，Ⅳ正确。</div></div>
