server {
    listen 80;
    server_name wenhao.vip www.wenhao.vip;

    # Let's Encrypt HTTP-01 验证目录
    location /.well-known/acme-challenge/ {
        root /var/www/p408/acme;
    }

    # 其他 HTTP 请求跳转到 HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name wenhao.vip www.wenhao.vip;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;

    # 迁移脚本生成的 SVG 与项目自带图片
    location /static/questions/ {
        alias /var/www/p408/static/questions/;
        add_header Cache-Control "public, max-age=86400";
    }
    location /static/ {
        alias /var/www/p408/html-static/;
        add_header Cache-Control "public, max-age=86400";
    }
    location /image/ {
        alias /var/www/p408/html-image/;
        add_header Cache-Control "public, max-age=86400";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/health {
        proxy_pass http://api:8000/api/health;
        access_log off;
    }
}
