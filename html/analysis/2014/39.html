<div class="content"><div class="analysis-content"><br/>UDP 提供的是无连接的服务，I 正确；同时 UDP 也提供复用/分用服务，II 正确；UDP 虽然有差错校验机制，但是 UDP 的差错校验只是检査数据在传输的过程中有没有出错，出错的数据直接丢弃，并没有重传等机制，不能保证可靠传输，使用 UDP 协议时，可靠传输必须由应用层实现，III 错误。答案选 B。</div></div>
