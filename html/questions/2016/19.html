<body>
<div class="content"><p>在无转发机制的五段基本流水线中，下列指令序列存在数据冒险的指令对是（ ）。</p>
<pre tabindex="0"><code>I1: add R1, R2, R3;         // (R2)+(R3)→R1
I2: add R5, R2, R4;         // (R2)+(R4)→R5
I3: add R4, R5, R3;         // (R5)+(R3)→R4
I4: add R5, R2, R6;         // (R2)+(R6)→R5
</code></pre>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">I1 和 I2</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">I2 和 I3</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">I2 和 I4</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">I3 和 I4</span></div></div>


</body>
