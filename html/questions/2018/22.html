<body>
<div class="content"><p>下列关于外部 I/O 中断的叙述中，正确的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">中断控制器按所接收中断请求的先后次序进行中断优先级排队</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">CPU 响应中断时，通过执行中断隐指令完成通用寄存器的保护</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">CPU 只有在处于中断允许状态时，才能响应外部设备的中断请求</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">有中断请求时，CPU 立即暂停当前指令执行，转去执行中断服务程序</span></div></div>


</body>
