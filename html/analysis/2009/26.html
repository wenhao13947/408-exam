<div class="content"><div class="analysis-content"><br/>每个进程都拥有自己独立的 内存空间，若一个进程在运行时所产生的地址在其地址空间之外，则发生地址越界，因此需要进行界地址保护，即当程序要访问某个内存单元时，由硬件检查是否允许，如果允许则执行，否则产生地址越界中断。</div></div>
