<div class="content"><div class="analysis-content"><br/>AOE 网 是以边表示活动的有向无环网。活动 d 开始必须满足活动 a 和活动 b 结束，所以最早开始时间是 12。最晚开始时间是指不会延长整个网的结束时间的前提下，d 的开始时间。结点 1 到结点 6 的最长路径（关键路径）是 27，结点 4 的最晚开始时间是 27-6=21，结点 d 的最晚开始时间是 21-7=14。答案选 C。</div></div>
