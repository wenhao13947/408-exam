<div class="content"><p>若 UDP 协议在计算校验和过程中，计算机得到中间结果为 1011 1001 1011 0110 时，还需要加上最后
一个 16 位数 0110 0101 1100 0101，则最终计算得到的校验和是（）</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">0001 1111 0111 1011</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">0001 1111 0111 1100</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">1110 0000 1000 0011</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">1110 0000 1000 0100</span></div></div>


</body>
