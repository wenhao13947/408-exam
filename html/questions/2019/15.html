<div class="content"><p>某计算机采用大端方式，按字节编址。某指令中操作数的机器数为 1234FF00H，该操作数采用基址寻址方式，形式地址（用补码表示）为 FF12H，基址寄存器内容为 F0000000H，则该操作数的 LSB（最低有效字节）所在的地址是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">F000FF12H</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">F000FF15H</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">EFFFFF12H</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">EFFFFF15H</span></div></div>
