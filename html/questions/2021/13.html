<div class="content"><p>已知带符号整数用补码表示，变量 x，y，z 的机器数分别为 FFFDH，FFDFH，7FFCH，下列结论中，正确的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">若 x、y 和 z 为无符号整数，则 z &lt; x &lt; y</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">若 x、y 和 z 为无符号整数，则 x &lt; y &lt; z</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">若 x、y 和 z 为带符号整数，则 x &lt; y &lt; z</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">若 x、y 和 z 为带符号整数，则 y &lt; x &lt; z</span></div></div>
