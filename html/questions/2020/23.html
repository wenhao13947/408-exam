<body>
<div class="content"><p>若多个进程共享同一个文件 F，则下列叙述中，正确的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">各进程只能用“读”方式打开文件 F</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">在系统打开文件表中仅有一个表项包含 F 的属性</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">各进程的用户打开文件表中关于 F 的表项内容相同</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">进程关闭 F 时，系统删除 F 在系统打开文件表中的表项</span></div></div>
