<div class="content"><div class="analysis-content"><br/>表达式求值是栈的典型应用。中缀表达式不仅依赖千运算符的优先级，而且要处理括号。后缀表达式的运算符在表达式的后面且没有括号，其形式已经包含了运算符的优先级。所以从 中序转后序 需要用运算符进行处理，使其包含运算符优先级的信息，从而转换为后缀表达式的形式。</div></div>
