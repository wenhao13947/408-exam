<div class="content"><div class="analysis-content"><br/><p>在外排序的多路归并中，败者树（Loser Tree）是一种优化的数据结构，用于快速找出多个归并段中当前最小的关键字。它是一个完全二叉树，每个非叶子节点保存的是“败者”，而整棵树的根节点保存的是当前“冠军” —— 即：</p><blockquote><p>当前最小关键字所在的归并段号。</p></blockquote><p>所以答案选择 D。</p></div></div>
