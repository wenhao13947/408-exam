<div class="content"><p>用户程序发出磁盘 I/O 请求后，系统的正确处理流程是（ ）。</p>

<div class="option"><span class="opt-label">C.</span><span class="opt-content">用户程序→设备驱动程序→系统调用处理程序→中断处理程序</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">用户程序→设备驱动程序→中断处理程序→系统调用处理程序</span></div></div>
