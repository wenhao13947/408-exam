<div class="content"><div class="analysis-content"><br/>USB（通用串行总线）的特点有：① 即插即用；② 热插拔；③ 有很强的连接能力，采用菊花链形式将众多外设连接起来；④ 有很好的可扩充性，一个 USB 控制器可扩充高达 127 个外部USB 设备；⑤ 高速传输，速度可达 480Mbps。所以 A、B、C 选项都符合 USB 总线的特点。对于 D, USB 是串行总线，不能同时传输 2 位数据。</div></div>
