<div class="content"><p>对任意给定的含 n (n &gt; 2) 个字符的有限集 S, 用二叉树表示 S 的哈夫曼编码集和定长编码集，分别得到二叉树 T1 和 T2。下列叙述中，正确的是 ( )。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">T1 与 T2 的结点数相同</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">T1 的高度大于 T2 的高度</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">出现频次不同的字符在 T1 中处于不同的层</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">出现频次不同的字符在 T2 中处于相同的层</span></div></div>


</body>
