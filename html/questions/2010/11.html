<div class="content"><p>对一组数据 (2，12，16，88，5，10) 进行排序，若前三趟排序结果如下：</p>
<p>第一趟排序结果：2，12，16，5，10，88</p>
<p>第二趟排序结果：2，12，5，10，16，88</p>
<p>第三趟排序结果：2，5，10，12，16，88</p>
<p>则采用的排序方法可能是（）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">冒泡排序</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">希尔排序</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">归并排序</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">基数排序</span></div></div>
