<div class="content"><div class="analysis-content"><br/>对于无噪声理想信道，信道的最大数据传输率可以通过 奈奎斯特定理 计算，最大数据传输的次数为 2×4MHz=8MHz，代表每秒传输 8M 次，因为最大的数据传输率为 48Mbps，所以每次需要传输的比特数量为 48Mbps/8MHz=6 位，所以每次传输的数据量位 6 比特，那么采用的 QAM 调制方案为 26=64，即采用 QAM-64 的方案。本题的正确选项为 C。</div></div>
