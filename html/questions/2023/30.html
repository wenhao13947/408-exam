<div class="content"><p>进程 R 和 S 共享数据 data，若 data 在 R 和 S 中所在页的页号分别为 p1 和 p2，两个页所对应的页框号分别为 f1 和 f2，则下列叙述中，正确的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">p1 和 p2 一定相等，f1 和 f2 一定相等</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">p1 和 p2 一定相等，f1 和 f2 不一定相等</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">p1 和 p2 不一定相等，f1 和 f2 一定相等</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">p1 和 p2 不一定相等，f1 和 f2 不一定相等</span></div></div>


</body>
