<div class="content"><div class="analysis-content"><br/>若 x, y 和 z 均为无符号整数，则 x &gt; y &gt; z，A 和 B 错误。若 x, y 和 z 均为带符号整数，补码的最高位是符号位，0 表示正数，1 表示负数，因此 z 为正数，而 x 和 y 为负数。对于 x 和 y 的比较，数值位取反加一，可知 x = -3H，y = -21H，故 x &gt; y。</div></div>
