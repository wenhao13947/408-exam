
<!DOCTYPE html>

<title>2025-第2题-题目</title>

<body>
<div class="content"><p>已知算法 A 用于检查字符串中各类括号是否匹配，A 执行过程中使用初始为空的栈保存遇到的括号。若栈的容量是 3，则下列选项中，A 不能处理的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content"><code>(a+[b+(c+d)/e]+f)+g-h</code></span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content"><code>[a*((b+c)/(d-e)+f/g)-h]</code></span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content"><code>[a*(b-(c-d)*e/(f+g))-h]</code></span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content"><code>[a-(b+[c*(d+e)-f]+g+h)]</code></span></div></div>


</body>
</html>
