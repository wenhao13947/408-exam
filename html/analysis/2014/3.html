<div class="content"><div class="analysis-content"><p><code>end1</code> 指向队头元素，<code>end2</code> 指向队尾元素的后一个位置。初始队列为空时，两者指向同一位置，因此队空条件为 <code>end1 == end2</code>。</p><p>循环队列最多存放 <code>M-1</code> 个元素，即始终空出一个数组单元来区分队空与队满。队满时，从 <code>end2</code> 沿入队方向再前进一个位置就会到达 <code>end1</code>，因此队满条件为 <code>end1 == (end2 + 1) mod M</code>。</p><p>故选 <strong>A</strong>。</p></div></div>
