<body>
<div class="content"><p>某计算机主存地址空间大小为 256MB，按字节编址。虚拟地址空间大小为 4GB，采用页式存储管理，页面大小为 4KB，TLB（快表）采用全相联映射，有 4 个页表项，内容如下表所示。</p>
<table class="table td-initial"><thead><tr><th>有效位</th><th>标记</th><th>页框号</th><th>…</th></tr></thead><tbody><tr><td>0</td><td>FF180H</td><td>0002H</td><td>…</td></tr><tr><td>1</td><td>3FFF1H</td><td>0035H</td><td>…</td></tr><tr><td>0</td><td>02FF3H</td><td>0351H</td><td>…</td></tr><tr><td>1</td><td>03FFFH</td><td>0153H</td><td>…</td></tr></tbody></table>
<p>则对虚拟地址 03FFF180H 进行虚实地址变换的结果是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">0153180H</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">0035180H</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">TLB 缺失</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">缺页</span></div></div>


</body>
