<div class="content"><p>假设某系统使用时间片轮转调度算法进行 CPU 调度，时间片大小为 5 ms，系统共有 10 个进程，初始时均处于就绪队列，执行结束前仅处于执行态或就绪态。若队尾的进程 P 所需 CPU 时间最短，时间为 25 ms。在不考虑系统开销的情况下，则进程 P 的周转时间为（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">200ms</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">205ms</span></div>

<div class="option"><span class="opt-label">D.</span><span class="opt-content">295ms</span></div></div>
