<div class="content"><p>某浏览器发出的 HTTP 请求报文如下（ ）。</p>
<pre tabindex="0"><code>GET /index .html HTTP/1.1
Host: www.test.edu.cn
Connection: close
Cookie: 123456
</code></pre>
<p>下列叙述中，错误的是</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">该浏览器请求浏览 index.html</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">index.html 存放在 www.test.edu.cn 上</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">该浏览器请求使用持续连接</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">该浏览器曾经浏览过 www.test.edu.cn</span></div></div>


</body>
