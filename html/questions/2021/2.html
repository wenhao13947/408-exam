<div class="content"><p>已知初始为空的队列 Q 的一端仅能进行入队操作，另外一端既能进行入队操作又能进行出队操作。若 Q 的入队序列是 1, 2, 3, 4, 5 , 则不能得到的出队序列是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">5,4,3,1,2</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">5,3,1,2,4</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">4,2,1,3,5</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">4,1,3,2,5</span></div></div>
