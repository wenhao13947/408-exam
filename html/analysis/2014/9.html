<div class="content"><div class="analysis-content"><br/>关键字数量不变，要求结点数量最多，那么即每个结点中含关键字的数最最少。根据 4 阶 B 树 的定义，根结点最少含 1 个关键字，非根结点中最少含 ⌈4/2⌉-1=1 个关键字，所以每个结点中，关键字数量最少都为 1 个，即每个结点都有 2 个分支，类似于排序二叉树，而 15 个结点正好可以构造一个 4 层的 4 阶 B 树，使得叶结点全在第四层，符合 B 树定义，因此选 D。</div></div>
