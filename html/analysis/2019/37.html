<div class="content"><div class="analysis-content"><br/>本题考察 变长子网划分。网络前缀为 20 位，将 101.200.16.0/20 划分为 5 个子网，为了保证有子网的可分配 IP 地址数尽可能小，即要让其他子网的可分配 IP 地址数尽可能大，不能采用平均划分的方法，而要采用变长的子网划分方法，也就是最大子网用 1 位子网号，第二大子网用 2 位子网号，以此类推。当地址范围为 101.200.31.1/24~101.200.31.254/24 时，可分配的 IP 地址数为 254 个，即可能的最小子网的可分配 IP 地址数是 254 个。</div></div>
