<div class="content"><div class="analysis-content"><br/><p>A. open() 系统调用用于打开一个文件。它需要一个文件名作为参数，因此它包含了按名
查找文件的功能。如果文件存在并且进程有足够的权限，open() 会成功打开文件并返回一个文件
描述符，否则，它会返回一个错误。</p><p>B. read() 系统调用用于从已打开的文件中读取数据。</p><p>C. write() 系统调用用于向已打开的文件中写入数据。</p><p>D. close() 系统调用用于关闭已打开的文件。</p></div></div>
