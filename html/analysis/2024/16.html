<div class="content"><div class="analysis-content"><br/><p>主存 - 外存层次的映射方式通常采用页式映射，而不是直接映射。页式映射是一种将虚拟地址空间分割为固定大小的单元（页）的映射方式，它将页映射到物理地址的空间的相应单元（页框）中。页式映射的优点是减少了内外存之间的交换次数，提高了空间利用率，缺点是增加了地址转换的开销，需默维护页表。</p><p>想一想，如果主存 - 外存页面采用直接映射的话，那么替换算法都直接没用了，所以 D 肯定是错误的。</p></div></div>
