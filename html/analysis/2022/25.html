<div class="content"><div class="analysis-content"><br/><p>本题考察 优先级调度：</p><ul><li>0 时刻调度进程 P0 获得 CPU；</li><li>10ms 时 P2 进入就绪队列，调度 P2 抢占获得 CPU；</li><li>15ms 时 P3 进入就绪队列，调度 P3 抢占获得 CPU；</li><li>25ms 时 P3 执行完毕，调度 P2 获得 CPU；</li><li>40ms 时 P2 执行完毕，调度 P0 获得 CPU；</li><li>130ms 时 P0 执行完毕，调度 P1 获得 CPU；</li><li>190ms 时 P1 执行完毕，结束；总共调度 6 次。</li></ul></div></div>
