<div class="content"><p>下列关于栈的叙述中，错误的是（ ）。</p>
<p>I. 采用非递归方式重写递归程序时必须使用栈</p>
<p>II. 函数调用时，系统要用栈保存必要信息</p>
<p>III. 只要确定了入栈次序，即可确定出栈次序</p>
<p>IV. 栈是一种受限的线性表，允许在其两端进行操作</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅 I</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 I、II、III</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 I、III、IV</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅 II、III、IV</span></div></div>
