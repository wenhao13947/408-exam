<div class="content"><div class="analysis-content"><br/>MIPS 是每秒执行多少百万条指令，适用千衡量标量机的性能。CPI 是平均每条指令的时钟周期数。IPC 是 CPI 的倒数，即每个时钟周期执行的指令数。MFLOPS 是每秒执行多少百万条浮点数运算，用来描述浮点数运算速度，适用于衡量向量机的性能。</div></div>
