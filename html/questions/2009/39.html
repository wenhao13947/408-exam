<div class="content"><p>一个 TCP 连接总是以 1KB 的最大段长发送 TCP 段，发送方有足够多的数据要发送。当拥塞窗口为 16KB 时发生了超时，如果接下来的 4 个 RTT（往返时间）时间内的 TCP 段的传输都是成功的，那么当第 4 个 RTT 时间内发送的所有 TCP 段都得到肯定应答时，拥塞窗口大小是（）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">7 KB</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">8 KB</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">9 KB</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">16 KB</span></div></div>
