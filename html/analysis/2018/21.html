<div class="content"><div class="analysis-content"><br/>总线数据传输率 ＝ 总线工作频率 x 总线带宽（＝总线宽度 / 8）, 所以 Ⅰ 和 Ⅱ 会影响总线数据传输率。采用突发总线传输事务（也称猝发传输），在一个总线周期内传输存储地址连续的多个数据字，从而提高了传输效率。采用地址 I 数据线复用只是减少了线的数量，节省了成本，并不能提高传输率。</div></div>
