<div class="content"><p>下列关于 ipv6 和 ipv4 的叙述中，正确的是（ ）</p>

<p>II. ipv4 和 ipv6 的基本首部的长度均可变</p>
<p>III.ipv4 向 ipv6 过渡可以采用双协议栈和隧道技术</p>
<p>IV. ipv6 首部的 Hop-Limit 等价于 ipv4 首部的 TTL 字段</p>
