<div class="content"><p>下列关于 UDP 协议的叙述中，正确的是（ ）。</p>

<p>III. 通过差错校验，保障可靠数据传输</p>

<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 I、II</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 II、III</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">I、II、III</span></div></div>
