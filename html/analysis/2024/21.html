<div class="content"><div class="analysis-content"><br/><p>中断是指外部设备或者程序需要 CPU 的服务时，向 CPU 发出一个信号，请求 CPU 暂停当前的任务，转而处理中断请求的情况。</p><p>中断响应顺序是指当同时有多个中断请求时，CPU 按照一定的优先级顺序来选择响应哪个中断的规则。</p><p>中断屏蔽字只能控制中断的开关，而不能控制中断的顺序，中断的顺序由中断的优先级决定，优先级高的中断先被响应，优先级低的中断后被响应。</p></div></div>
