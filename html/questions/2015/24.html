<title>2015-第24题-题目</title>

<link href="../../css/style.css" rel="stylesheet"/></head>
<body>
<div class="content"><p>假定下列指令已装入指令寄存器，则执行时不可能导致 CPU 从用户态变为内核态（系统态）的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content"><code>DIV R0, R1;</code> (R0)/(R1)→R0</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content"><code>INT n;</code> 产生软中断</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content"><code>NOT R0;</code> 寄存器 <code>R0</code> 的内容取非</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content"><code>MOV R0, addr;</code> 把地址 <code>addr</code> 的内存数据放入寄存器 <code>R0</code> 中</span></div></div>


</body>
</html>
