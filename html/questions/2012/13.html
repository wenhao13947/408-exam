<div class="content"><p>假定编译器规定 int 和 short 型长度分别为 32 位和 16 位，执行下列 C 语言语句：</p>
<div class="highlight"><pre style="background-color:#f8f8f8;-moz-tab-size:4;-o-tab-size:4;tab-size:4" tabindex="0"><code class="language-c" data-lang="c"><span style="display:flex"><span><span style="color:#204a87;font-weight:700">unsigned</span> <span style="color:#204a87;font-weight:700">short</span> <span style="color:#000">x</span><span style="color:#ce5c00;font-weight:700">=</span><span style="color:#0000cf;font-weight:700">65530</span><span style="color:#000;font-weight:700">;</span>
</span></span><span style="display:flex"><span><span style="color:#204a87;font-weight:700">unsigned</span> <span style="color:#204a87;font-weight:700">int</span> <span style="color:#000">y</span><span style="color:#ce5c00;font-weight:700">=</span><span style="color:#000">x</span><span style="color:#000;font-weight:700">;</span>
</span></span></code></pre></div>
<p>得到 y 的机器数为（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">0000 7FFAH</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">0000 FFFAH</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">FFFF 7FFAH</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">FFFF FFFAH</span></div></div>
