<div class="content"><div class="analysis-content"><br/>实现临界区互斥需满足多个准则。“忙则等待”准则，即两个进程不能同时访问临界区，Ⅰ
正确。 “空闲让进”准则，若临界区空闲，则允许其他进程访问，Ⅱ 正确。 “有限等待”
准则，即进程应该在有限时间内访问临界区，Ⅲ 正确。Ⅰ、Ⅱ 和 Ⅲ 是互斥机制必须遵循的
原则。Ⅳ 是“让权等待”准则，不一定非得实现，如皮特森算法。</div></div>
