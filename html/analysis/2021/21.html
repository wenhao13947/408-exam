<div class="content"><div class="analysis-content"><br/>大部分中断都是在一条指令执行完成后（中断周期）才被检测并处理，除了缺页中断和 DMA 请求。DMA 请求只请求总线的使用权，不影响当前指令的执行，不会导致被中断指令的重新执行；而缺页中断发生在取指或间址等指令执行过程之中，并且会阻塞整个指令。当缺页中断发生后，必须回到这条指令重新执行，以便重新访存。选 B。</div></div>
