<div class="content"><div class="analysis-content"><br/>采用 静态优先级调度 时，当系统总是出现优先级高的任务时，优先级低的任务会总是得不到处理机而产生饥饿现象；短任务优先调度不管是抢占式或是非抢占的，当系统总是出现新来的短任务时，长任务会总是得不到处理机，产生饥饿现象，因此 B、C、D 都错误，选 A。</div></div>
