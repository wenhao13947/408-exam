<body>
<div class="content"><p>系统将数据从磁盘读到内存的过程包括以下操作：</p>
<p>① DMA 控制器发出中断请求</p>
<p>② 初始化 DMA 控制器并启动磁盘</p>
<p>③ 从磁盘传输一块数据到内存缓冲区</p>
<p>④ 执行“DMA 结束”中断服务程序</p>
<p>正确的执行顺序是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">③→①→②→④</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">②→③→①→④</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">②→①→③→④</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">①→②→④→③</span></div></div>


</body>
