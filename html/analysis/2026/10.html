<p>正确答案：A</p><p>题目要求总成绩为第一关键字、C1 成绩为第二关键字，并保留同关键字记录的初始相对次序。先按次要关键字 C1 排序，再用稳定排序按主要关键字总成绩排序，属于基数排序的低位优先思想。两轮均按题设要求从高到低排列。快速排序、希尔排序和选择排序不保证稳定性。</p>
