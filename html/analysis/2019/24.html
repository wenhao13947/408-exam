<div class="content"><div class="analysis-content"><br/>参考 进程状态转化，当被阻塞进程等待的某资源为可用时，进程将会被唤醒。I/O 结束后，等待该 I/O 结束而被阻塞的有关进程就会被唤醒，Ⅰ正确；某进程退出临界区后，之前因需要进入该临界区而被阻塞的有关进程就会被唤醒，Ⅱ正确，当前进程的时间片用完后进入就绪队列等待重新调度，优先级最高的进程将获得处理机资源从就绪态变成执行态，Ⅲ错误。</div></div>
