<div class="content"><div class="analysis-content"><br/>对于 I，最小生成树 的树形可能不唯一（这是因为可能存在权值相同的边），但是代价一定是唯一的，I 正确。对于Ⅱ，如果权值最小的边有多条并且构成环状，则总有权值最小的边将不出现在某棵最小生成树中，Ⅱ错误。对于Ⅲ，设 N 个结点构成环，N-1 条边权值相等，则从不同的顶点开始普里姆算法会得到 N-1 中不同的最小生成树，Ⅱ 错误。对于 V，当最小生成树唯一时（各边的权值不同），Prim 算法和 Kruskal 算法得到的最小生成树相同，IV 错误。</div></div>
