<div class="content"><p>文件系统用 <a href="https://www.csgraduates.com/operating_system/files/file_system/#%e4%bd%8d%e7%a4%ba%e5%9b%be%e6%b3%95">位图法</a> 表示磁盘空间的分配情况，位图存于磁盘的 32～127 号块中，每个盘块占 1024 个字节，盘块和块内字节均从 0 开始编号。假设要释放的盘块号为 409612，则位图中要修改的位所在的盘块号和块内字节序号分别是（ ）。</p>
