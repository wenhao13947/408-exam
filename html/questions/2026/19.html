<title>2026-第19题-题目</title>

<body>
<div class="content">
<p>某计算机按字节编址，虚拟地址为 16 位，页大小为 256B，页表项中包含装入位（P）、页框号（PPN）等字段，TLB 采用 4 路组相联映射方式，共有 16 个 TLB 表项，TLB 表项中包含标记（Tag）、有效位（V）等字段。在 TLB 表项与主存页表同步后，若主存页表中页号 22 对应的页表项中 P=0、PPN=2AH，则下列选项中，不可能出现在组号为 2 的 TLB 表项中的是</p><div class="option"><span class="opt-label">A.</span><span class="opt-content">Tag=05H、V=1、PPN=1CH</span></div><div class="option"><span class="opt-label">B.</span><span class="opt-content">Tag=06H、V=1、PPN=2AH</span></div><div class="option"><span class="opt-label">C.</span><span class="opt-content">Tag=16H、V=0、PPN=2AH</span></div><div class="option"><span class="opt-label">D.</span><span class="opt-content">Tag=1AH、V=0、PPN=1CH</span></div>
</div>
