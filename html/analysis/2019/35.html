<div class="content"><div class="analysis-content"><br/>对于一般的如果要满足在窗口中发送缓存的帧序号不存在二义性，那么需要满足 窗口大小限制：发送窗口大小 + 接收窗口大小 ≤
<span class="katex"><span aria-hidden="true" class="katex-html"><span class="base"><span class="strut" style="height:.6644em"></span><span class="mord"><span class="mord">2</span><span class="msupsub"><span class="vlist-t"><span class="vlist-r"><span class="vlist" style="height:.6644em"><span style="top:-3.063em;margin-right:.05em"><span class="pstrut" style="height:2.7em"></span><span class="sizing reset-size6 size3 mtight"><span class="mord mathnormal mtight">n</span></span></span></span></span></span></span></span></span></span></span>
。例如当 n=3 时，若发送窗口大小 + 接收窗口大小大于帧序号数，那么说明其容纳下的帧数已经超过了帧的序号，则对于接收方，一定会出现重复的帧号，此时若出现故障，就不能辨别是同帧号中哪一个帧出现了丢失</div></div>
