<div class="content"><div class="analysis-content"><br/>磁盘存储器 的最小读写单位为一个扇区，即磁盘按块存取，选项 C 错误。磁盘存储数据之前需进行格式化，将磁盘分成扇区，并写入信息，因此磁盘的格式化容量比非格式化容量小，选项 A 正确。磁盘扇区中包含数据、地址和校验等信息，选项 B 正确。磁盘存储器由磁盘控制器、磁盘驱动器和盘片组成，选项 D 正确。</div></div>
