<div class="content"><p>对于页式虚拟存储管理系统，下列关于存储器层次结构的叙述中，错误的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">Cache-主存层次的交换单位为主存块，主存-外存层次的交换单位为页</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">Cache-主存层次替换算法由硬件实现，主存-外存层次由软件实现</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">Cache-主存层次可采用回写法写策略，主存-外存层次通常采用回写法</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">Cache-主存层次可采用直接映射，主存-外存层次通常采用直接映射</span></div></div>
