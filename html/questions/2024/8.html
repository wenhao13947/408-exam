<div class="content"><p>使用快速排序算法对含 N（N ≥ 3） 个元素的数组 M 进行排序，若第一趟排序将除枢轴外的 N-1 个元素划分为 P 和 Q 两个部分，则下列叙述中，正确的是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">P 和 Q 块间有序</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">P 和 Q 均块内有序</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">P 和 Q 的元素个数大致相等</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">P 和 Q 中均不存在相等的元素</span></div></div>
