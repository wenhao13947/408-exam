<div class="content"><p>当系统发生抖动 (thrashing) 时，可以采取的有效措施是（ ）。</p>
<p>I. 撤销部分进程</p>
<p>II. 增加磁盘交换区的容量</p>
<p>III. 提高用户进程的优先级</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅 I</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅 II</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅 III</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">仅 I、II</span></div></div>
