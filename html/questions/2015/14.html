<title>2015-第14题-题目</title>

<body>
<div class="content"><p>下列有关浮点数加减运算的叙述中，正确的是（ ）。</p>
<p>Ⅰ. 对阶操作不会引起阶码上溢或下溢</p>
<p>Ⅱ. 右规和尾数舍入都可能引起阶码上溢</p>
<p>Ⅲ. 左规时可能引起阶码下溢</p>
<p>Ⅳ. 尾数溢出时结果不一定溢出</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">仅Ⅱ、Ⅲ</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">仅Ⅰ、Ⅱ、Ⅳ</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">仅Ⅰ、Ⅲ、Ⅳ</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">Ⅰ、Ⅱ、Ⅲ、Ⅳ</span></div></div>


</body>
</html>
