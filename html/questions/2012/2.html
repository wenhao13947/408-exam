<div class="content"><p>已知操作符包括 <code>+</code>、<code>−</code>、<code>∗</code>、<code>/</code>、<code>(</code> 和 <code>)</code>。将中缀表达式 <code>a+b−a∗((c+d)/e−f)+g</code> 转换为等价的后缀表达式 <code>ab+acd+e/f−∗−g+</code> 时，用栈来存放暂时还不能确定运算次序的操作符，若栈初始为空，则转换过程中同时保存在栈中的操作符的最大个数是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">5</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">7</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">8</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">11</span></div></div>


</body>
