<div class="content"><div class="analysis-content"><br/>考虑到局域网信道质量好，以太网采取了两项重要的措施以使通信更简便：① 采用无连接的工作方式；② 不对发送的数据帧进行编号，也不要求对方发回确认。因此，以太网提供的服务是不可靠的服务，即尽最大努力的交付。差错的纠正由高层完成。</div></div>
