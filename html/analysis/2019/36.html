<div class="content"><div class="analysis-content"><br/>本题考察 CSMA/CD 协议中的 限制条件：每次发送一个数据帧，最少需要 2τ时间才能收到其回复。因此发送一个最小数据帧的时间必须大于 2τ，再本题中 128×8/100M&gt;=2τ，所以 τ 最大为 5.12us，答案为 B。</div></div>
