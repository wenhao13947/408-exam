<div class="content"><div class="analysis-content"><br/>根据 总线组成，I/O 接口与 CPU 之间的 I/O 总线有数据线、控制线和地址线。控制线和地址线都是单向传输的，从 CPU 传送给 I/O 接口，而 I/O 接口中的命令字由 CPU 发往 I/O 接口，状态字和中断类型号由 I/O 接口提供给 CPU 的，故只能通过 I/O 总线的数据线传输。</div></div>
