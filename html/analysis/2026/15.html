<p>正确答案：A</p><p>按字节编址、8 个芯片交叉编址，片号由地址最低 3 位确定。0018 001DH 的最低十六进制位 D 对应最低 3 位 101；A 的末位 5 也对应 101。B、C、D 的最低 3 位分别为 000、110、100，因此只有 A 与给定地址位于同一芯片。</p>
