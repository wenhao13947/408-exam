<div class="content"><p>假定带符号整数采用补码表示，若 int 型变量 x 和 y 的机器数分别是 FFFF FFDFH 和 0000 0041H，则 x、y 的值以及 x-y 的机器数分别是（ ）。</p>
<div class="option"><span class="opt-label">A.</span><span class="opt-content">x=-65，y=41，x-y 的机器数溢出</span></div>
<div class="option"><span class="opt-label">B.</span><span class="opt-content">x=-33，y=65，x-y 的机器数为 FFFFFF9DH</span></div>
<div class="option"><span class="opt-label">C.</span><span class="opt-content">x=-33，y=65，x-y 的机器数为 FFFFFF9EH</span></div>
<div class="option"><span class="opt-label">D.</span><span class="opt-content">x=-65，y=41，x-y 的机器数为 FFFFFF96H</span></div></div>
