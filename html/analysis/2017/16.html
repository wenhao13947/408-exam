<div class="content"><div class="analysis-content"><br/>三地址指令有 29 条，所以它的操作码至少为 5 位。以 5 位进行计算，它剩余 32-29=3 种操作码给二地址。而二地址另外多了 6 位给操作码，因此它的数量最大达 3x64=192。所以指令字长最少为 23 位，因为计算机按字节编址，需要是 8 的倍数，所以指令字长至少应该是 24 位，故选 A。</div></div>
